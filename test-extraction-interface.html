<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Extraction OIC - Interface de Diagnostic</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 15px; margin: 10px 0; border-radius: 8px; }
        .success { background: #1a472a; border: 1px solid #16a34a; }
        .error { background: #7f1d1d; border: 1px solid #dc2626; }
        .warning { background: #78350f; border: 1px solid #ea580c; }
        .info { background: #1e3a8a; border: 1px solid #3b82f6; }
        button { padding: 12px 24px; margin: 5px; border: none; border-radius: 6px; background: #3b82f6; color: white; cursor: pointer; font-size: 16px; }
        button:hover { background: #2563eb; }
        button:disabled { background: #374151; cursor: not-allowed; }
        .logs { background: #000; padding: 15px; border-radius: 8px; margin: 10px 0; font-family: 'Courier New', monospace; font-size: 14px; max-height: 400px; overflow-y: auto; }
        .progress { background: #374151; height: 20px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: #3b82f6; height: 100%; transition: width 0.3s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Test Extraction OIC - Diagnostic Temps Réel</h1>
        
        <div id="status" class="status info">
            📊 Initialisation du diagnostic...
        </div>
        
        <div>
            <button onclick="testDirectExtraction()" id="testBtn">🧪 Tester Edge Functions</button>
            <button onclick="checkDatabaseStatus()" id="dbBtn">💾 Vérifier Base de Données</button>
            <button onclick="startFullExtraction()" id="extractBtn">⚡ Déclencher Extraction</button>
        </div>
        
        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        <div id="progressText">Prêt à commencer...</div>
        
        <div class="logs" id="logs">
            <div>🔍 Logs d'activité en temps réel...</div>
        </div>
    </div>

    <script>
        const baseUrl = 'https://yaincoxihiqdksxgrsrk.supabase.co/functions/v1';
        const anonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaW5jb3hpaGlxZGtzeGdyc3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDI4MTE4MjcsImV4cCI6MjA1ODM4NzgyN30.HBfwymB2F9VBvb3uyeTtHBMZFZYXzL0wQmS5fqd65yU';
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString('fr-FR');
            const color = type === 'success' ? '#16a34a' : type === 'error' ? '#dc2626' : type === 'warning' ? '#ea580c' : '#3b82f6';
            logs.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }
        
        function updateStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        function updateProgress(percent, text) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').textContent = text;
        }
        
        async function testDirectExtraction() {
            log('🧪 Test des Edge Functions...', 'info');
            updateStatus('🧪 Test en cours...', 'warning');
            
            try {
                // Test auto-extract-oic
                const response1 = await fetch(`${baseUrl}/auto-extract-oic`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${anonKey}`
                    },
                    body: JSON.stringify({ action: 'test', source: 'diagnostic' })
                });
                
                if (response1.ok) {
                    const result1 = await response1.json();
                    log('✅ auto-extract-oic : Fonctionnelle', 'success');
                } else {
                    log(`❌ auto-extract-oic : HTTP ${response1.status}`, 'error');
                }
                
                // Test extract-edn-objectifs
                const response2 = await fetch(`${baseUrl}/extract-edn-objectifs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${anonKey}`
                    },
                    body: JSON.stringify({ action: 'rapport' })
                });
                
                if (response2.ok) {
                    const result2 = await response2.json();
                    log('✅ extract-edn-objectifs : Fonctionnelle', 'success');
                    log(`📊 Rapport: ${result2.total_competences_extraites || 0}/4872 compétences`, 'info');
                } else {
                    log(`❌ extract-edn-objectifs : HTTP ${response2.status}`, 'error');
                }
                
                updateStatus('✅ Tests Edge Functions terminés', 'success');
                
            } catch (error) {
                log(`💥 Erreur test: ${error.message}`, 'error');
                updateStatus('❌ Erreur lors des tests', 'error');
            }
        }
        
        async function checkDatabaseStatus() {
            log('💾 Vérification base de données...', 'info');
            
            try {
                const response = await fetch(`${baseUrl}/extract-edn-objectifs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${anonKey}`
                    },
                    body: JSON.stringify({ action: 'rapport' })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`📊 Total compétences: ${result.total_competences_extraites || 0}`, 'success');
                    log(`📈 Complétude: ${result.completude_globale || 0}%`, 'info');
                    log(`📋 Avec titre: ${result.with_title || 0}`, 'info');
                    log(`📝 Avec description: ${result.with_description || 0}`, 'info');
                    updateStatus('💾 Base de données accessible', 'success');
                } else {
                    log('❌ Erreur accès base de données', 'error');
                    updateStatus('❌ Problème base de données', 'error');
                }
            } catch (error) {
                log(`💥 Erreur DB: ${error.message}`, 'error');
                updateStatus('❌ Erreur base de données', 'error');
            }
        }
        
        async function startFullExtraction() {
            log('⚡ Démarrage extraction complète...', 'info');
            updateStatus('⚡ Extraction en cours...', 'warning');
            updateProgress(0, 'Démarrage...');
            
            try {
                // Déclencher l'extraction
                const response = await fetch(`${baseUrl}/auto-extract-oic`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${anonKey}`
                    },
                    body: JSON.stringify({ 
                        action: 'immediate_extraction',
                        source: 'interface_test' 
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    log(`🚀 Extraction démarrée: ${result.session_id}`, 'success');
                    updateProgress(10, 'Extraction initialisée...');
                    
                    if (result.session_id) {
                        // Surveiller le progrès
                        monitorExtraction(result.session_id);
                    } else {
                        log('⚠️ Aucun session_id retourné', 'warning');
                    }
                } else {
                    log(`❌ Erreur démarrage: HTTP ${response.status}`, 'error');
                    updateStatus('❌ Échec démarrage extraction', 'error');
                }
                
            } catch (error) {
                log(`💥 Erreur extraction: ${error.message}`, 'error');
                updateStatus('❌ Erreur extraction', 'error');
            }
        }
        
        async function monitorExtraction(sessionId) {
            let checks = 0;
            const maxChecks = 20;
            
            const monitor = setInterval(async () => {
                checks++;
                
                try {
                    const response = await fetch(`${baseUrl}/extract-edn-objectifs`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${anonKey}`
                        },
                        body: JSON.stringify({ action: 'status', session_id: sessionId })
                    });
                    
                    if (response.ok) {
                        const status = await response.json();
                        const progress = Math.min(95, (status.items_extracted || 0) / 4872 * 100);
                        
                        updateProgress(progress, `${status.items_extracted || 0}/4872 compétences`);
                        log(`📊 Progrès [${checks}]: ${status.items_extracted || 0}/4872 - ${status.status}`, 'info');
                        
                        if (status.status === 'termine') {
                            clearInterval(monitor);
                            updateProgress(100, 'Extraction terminée !');
                            updateStatus('🎉 Extraction terminée avec succès !', 'success');
                            log('🎉 EXTRACTION TERMINÉE !', 'success');
                            
                            // Rapport final
                            setTimeout(generateFinalReport, 2000);
                        } else if (status.status === 'erreur') {
                            clearInterval(monitor);
                            updateStatus('❌ Extraction échouée', 'error');
                            log(`💥 EXTRACTION ÉCHOUÉE: ${status.error_message}`, 'error');
                        }
                    }
                    
                    if (checks >= maxChecks) {
                        clearInterval(monitor);
                        log('⏰ Surveillance arrêtée après 10 minutes', 'warning');
                    }
                    
                } catch (error) {
                    log(`⚠️ Erreur surveillance: ${error.message}`, 'warning');
                }
            }, 30000); // Vérifier toutes les 30 secondes
        }
        
        async function generateFinalReport() {
            log('📋 Génération du rapport final...', 'info');
            
            try {
                const response = await fetch(`${baseUrl}/extract-edn-objectifs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${anonKey}`
                    },
                    body: JSON.stringify({ action: 'rapport' })
                });
                
                if (response.ok) {
                    const report = await response.json();
                    log('📊 RAPPORT FINAL:', 'success');
                    log(`📈 Compétences extraites: ${report.total_competences_extraites || 0}`, 'success');
                    log(`✅ Taux de complétude: ${report.completude_globale || 0}%`, 'success');
                    log(`🎯 Qualité extraction: ${report.extraction_quality || 'N/A'}`, 'success');
                }
            } catch (error) {
                log(`⚠️ Erreur rapport: ${error.message}`, 'warning');
            }
        }
        
        // Test automatique au chargement
        window.onload = () => {
            log('🔍 Interface de diagnostic chargée', 'info');
            updateStatus('🔍 Prêt pour les tests', 'info');
        };
    </script>
</body>
</html>
