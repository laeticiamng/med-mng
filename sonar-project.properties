# SonarQube Configuration for MedMng Platform

# Project identification
sonar.projectKey=medmng-platform
sonar.projectName=MedMng Platform
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=src/tests,test

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/coverage/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/mockData/**,\
  **/fixtures/**,\
  **/mocks/**

# Test file patterns
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.config.ts,\
  **/*.stories.tsx

# ESLint report
sonar.eslint.reportPaths=eslint-report.json

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Quality Gate settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Code analysis parameters
sonar.typescript.tsconfigPath=tsconfig.json

# Duplications
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.stories.tsx

# Security
sonar.security.hotspots.includePaths=src/**

# New Code definition (last 30 days)
sonar.newCode.referenceBranch=main
