name: TypeScript Type Safety Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  typescript-check:
    runs-on: ubuntu-latest
    name: TypeScript Type Safety

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript compilation check
        run: npx tsc --noEmit --strict

      - name: 🚫 Check for 'any' usage in critical files
        run: |
          echo "Checking for 'any' usage in critical files..."
          
          # List of critical files to check
          FILES=(
            "src/components/CASAuthTester.tsx"
            "src/utils/getCASCookies.ts" 
            "src/utils/testOICAccessWithCAS.ts"
            "src/types/cas.ts"
          )
          
          EXIT_CODE=0
          
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              
              # Check for 'any' usage (excluding comments and imports)
              if grep -n ": any\|<any>\|Array<any>\|Promise<any>" "$file" | grep -v "//"; then
                echo "❌ Found 'any' usage in $file"
                EXIT_CODE=1
              else
                echo "✅ No 'any' usage found in $file"
              fi
            else
              echo "⚠️ File $file not found"
            fi
          done
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Type safety check failed!"
            echo "Please replace 'any' types with proper TypeScript interfaces."
            echo "See src/types/cas.ts for available types."
            exit 1
          fi
          
          echo ""
          echo "✅ All type safety checks passed!"

      - name: 🧪 Run TypeScript-specific tests
        run: npm test test/typescript/