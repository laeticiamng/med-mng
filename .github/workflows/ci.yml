name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Build Docker image
        run: docker build -t med-mng .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.18.0
        with:
          image-ref: med-mng
          severity: CRITICAL
          exit-code: 1
