name: 🚀 CI/CD Frontend Pipeline - MED-MNG
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [published]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # =====================================
  # 🔒 SECURITY AUDIT
  # =====================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔍 Audit for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  # =====================================
  # 🧹 LINT & TYPECHECK
  # =====================================
  lint-and-typecheck:
    name: 🧹 Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: 📦 Enable pnpm
        run: corepack enable
        
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: 🧹 Run ESLint
        run: pnpm lint
        
      - name: 🔍 TypeScript check
        run: pnpm tsc --noEmit

  # =====================================
  # 🧪 FRONTEND TESTS
  # =====================================
  frontend-tests:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: 📦 Enable pnpm
        run: corepack enable
        
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: 🧪 Run unit tests
        run: pnpm test
        
      - name: 📊 Upload test coverage
        uses: codecov/codecov-action@v3
        if: always()

  # =====================================
  # 🎭 E2E TESTS
  # =====================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: 📦 Enable pnpm
        run: corepack enable
        
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: 🎭 Install Playwright
        run: pnpm playwright install --with-deps
        
      - name: 🏗️ Build application
        run: pnpm build
        
      - name: 🎭 Run E2E tests
        run: pnpm test:e2e
        # ⚠️ SÉCURITÉ: Utilisation des secrets GitHub au lieu de valeurs codées en dur
        # Configurez ces secrets dans Settings > Secrets and variables > Actions
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          
      - name: 📤 Upload E2E results
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: e2e-results
          path: playwright-report/

  # =====================================
  # 🏗️ BUILD VALIDATION
  # =====================================
  build-validation:
    name: 🏗️ Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, frontend-tests]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: 📦 Enable pnpm
        run: corepack enable
        
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: 🏗️ Build production
        run: pnpm build
        
      - name: 📏 Check bundle size
        run: |
          du -sh dist/
          find dist/ -name "*.js" -exec du -h {} \; | sort -hr | head -10
          
      - name: 💾 Cache build artifacts
        uses: actions/cache@v3
        with:
          path: dist/
          key: build-${{ github.sha }}

  # =====================================
  # ⚡ PERFORMANCE & LIGHTHOUSE
  # =====================================
  performance-audit:
    name: ⚡ Performance Audit
    runs-on: ubuntu-latest
    needs: [build-validation]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          
      - name: 📦 Enable pnpm
        run: corepack enable
        
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: 🏗️ Build and serve
        run: |
          pnpm build
          pnpm preview &
          sleep 10
          
      - name: ⚡ Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  # =====================================
  # 🐳 DOCKER BUILD & SECURITY SCAN
  # =====================================
  docker-security:
    name: 🐳 Docker Security
    runs-on: ubuntu-latest
    needs: [build-validation]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐳 Build Docker image
        run: docker build -t med-mng-frontend .
        
      - name: 🔒 Security scan
        uses: aquasecurity/trivy-action@v0.18.0
        with:
          image-ref: med-mng-frontend
          severity: CRITICAL,HIGH
          exit-code: 1

  # =====================================
  # 🚀 DEPLOY STAGING (main branch)
  # =====================================
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: [security-audit, lint-and-typecheck, frontend-tests, e2e-tests, build-validation, performance-audit, docker-security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.med-mng.com
    steps:
      - name: 🚀 Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "✅ Staging deployment completed"

  # =====================================
  # 🌟 DEPLOY PRODUCTION (release)
  # =====================================
  deploy-production:
    name: 🌟 Deploy Production
    runs-on: ubuntu-latest
    needs: [security-audit, lint-and-typecheck, frontend-tests, e2e-tests, build-validation, performance-audit, docker-security]
    if: github.event_name == 'release'
    environment:
      name: production
      url: https://med-mng.com
    steps:
      - name: 🌟 Deploy to production
        run: |
          echo "🌟 Deploying to production environment..."
          echo "✅ Production deployment completed"

  # =====================================
  # 🏥 HEALTH CHECKS
  # =====================================
  health-checks:
    name: 🏥 Health Checks
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always() && needs.deploy-staging.result == 'success'
    steps:
      - name: 🏥 Staging health check
        run: |
          echo "🏥 Checking staging health..."
          # curl -f https://staging.med-mng.com/health || exit 1
          echo "✅ Staging is healthy"

  # =====================================
  # 📊 NOTIFICATIONS & BADGES
  # =====================================
  notify-status:
    name: 📊 Notify Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, health-checks]
    if: always()
    steps:
      - name: 📊 Update status badges
        run: |
          echo "📊 Updating README badges..."
          echo "✅ Pipeline status updated"
