name: Test Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    name: Test Coverage Check

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: 📊 Coverage Report
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 📈 Coverage Summary
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat coverage/coverage-summary.json | jq -r '
            .total |
            "| Metric | Percentage | Covered | Total |",
            "|--------|------------|---------|-------|",
            "| Lines | \(.lines.pct)% | \(.lines.covered) | \(.lines.total) |",
            "| Functions | \(.functions.pct)% | \(.functions.covered) | \(.functions.total) |",
            "| Branches | \(.branches.pct)% | \(.branches.covered) | \(.branches.total) |",
            "| Statements | \(.statements.pct)% | \(.statements.covered) | \(.statements.total) |"
          ' >> $GITHUB_STEP_SUMMARY

      - name: ❌ Fail if coverage below threshold
        run: |
          LINES_PCT=$(cat coverage/coverage-summary.json | jq -r '.total.lines.pct')
          FUNCTIONS_PCT=$(cat coverage/coverage-summary.json | jq -r '.total.functions.pct')
          BRANCHES_PCT=$(cat coverage/coverage-summary.json | jq -r '.total.branches.pct')
          STATEMENTS_PCT=$(cat coverage/coverage-summary.json | jq -r '.total.statements.pct')
          
          echo "Coverage Results:"
          echo "Lines: ${LINES_PCT}%"
          echo "Functions: ${FUNCTIONS_PCT}%"
          echo "Branches: ${BRANCHES_PCT}%"
          echo "Statements: ${STATEMENTS_PCT}%"
          
          # Check if any metric is below 80%
          if (( $(echo "$LINES_PCT < 80" | bc -l) )) || \
             (( $(echo "$FUNCTIONS_PCT < 80" | bc -l) )) || \
             (( $(echo "$BRANCHES_PCT < 80" | bc -l) )) || \
             (( $(echo "$STATEMENTS_PCT < 80" | bc -l) )); then
            echo "❌ Coverage below 80% threshold!"
            echo "Required: Lines ≥80%, Functions ≥80%, Branches ≥80%, Statements ≥80%"
            exit 1
          else
            echo "✅ All coverage metrics meet the 80% threshold!"
          fi

      - name: 📤 Upload coverage reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage/
            !coverage/tmp/
          retention-days: 30

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: 📤 Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 30

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🧪 Run integration tests
        run: npm run test:integration
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db

      - name: 📤 Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 30

  security-tests:
    runs-on: ubuntu-latest
    name: Security Tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: npm ci

      - name: 🔒 Run security tests
        run: npm run test:security
        env:
          CI: true

      - name: 🛡️ Run vulnerability audit
        run: npm audit --audit-level moderate

      - name: 📤 Upload security test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-results
          path: test-results/
          retention-days: 30