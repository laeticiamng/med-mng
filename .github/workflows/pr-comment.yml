name: PR Test Results Comment

on:
  workflow_run:
    workflows: ["Tests CI"]
    types:
      - completed

jobs:
  comment:
    name: Comment Test Results on PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = ${{ github.event.workflow_run.pull_requests[0].number }};
            
            let comment = '## 🧪 Test Results\n\n';
            comment += `Workflow: ${context.payload.workflow_run.name}\n`;
            comment += `Status: ${context.payload.workflow_run.conclusion === 'success' ? '✅ Passed' : '❌ Failed'}\n`;
            comment += `Commit: ${context.payload.workflow_run.head_sha.substring(0, 7)}\n\n`;
            
            comment += '### Test Summary\n';
            comment += '- Unit Tests: ' + (context.payload.workflow_run.conclusion === 'success' ? '✅' : '❌') + '\n';
            comment += '- E2E Tests: ' + (context.payload.workflow_run.conclusion === 'success' ? '✅' : '❌') + '\n';
            comment += '- Lint: ' + (context.payload.workflow_run.conclusion === 'success' ? '✅' : '❌') + '\n\n';
            
            comment += `[View full workflow run](${context.payload.workflow_run.html_url})`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
