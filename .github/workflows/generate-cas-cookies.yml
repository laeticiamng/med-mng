name: Generate CAS Cookies

on:
  workflow_dispatch:  # Permet de lancer manuellement
    inputs:
      cas_username:
        description: 'CAS Username'
        required: true
        type: string
      cas_password:
        description: 'CAS Password'
        required: true
        type: string

jobs:
  generate-cookies:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install puppeteer
        
    - name: Generate CAS cookies
      env:
        CAS_USERNAME: ${{ github.event.inputs.cas_username }}
        CAS_PASSWORD: ${{ github.event.inputs.cas_password }}
      run: |
        echo "🚀 Génération des cookies CAS..."
        node generate-cas-cookie.js
        
    - name: Test cookies
      run: |
        echo "🧪 Test des cookies générés..."
        if [ -f .cookie ]; then
          echo "✅ Fichier cookie généré"
          echo "🍪 Cookie size: $(wc -c < .cookie) bytes"
          # Test avec l'API
          COOKIE_CONTENT=$(cat .cookie)
          curl -H "Cookie: $COOKIE_CONTENT" \
               -H "User-Agent: Mozilla/5.0 (compatible; GitHub-Action/1.0)" \
               "https://livret.uness.fr/lisa/2025/api.php?action=query&list=categorymembers&cmtitle=Catégorie:Objectif_de_connaissance&cmlimit=5&format=json" \
               -o test-result.json
          
          # Vérifier le résultat
          if jq -e '.query.categorymembers | length > 0' test-result.json > /dev/null; then
            echo "✅ Cookie fonctionnel - $(jq '.query.categorymembers | length' test-result.json) pages trouvées"
            jq -r '.query.categorymembers[] | "- \(.title) (ID: \(.pageid))"' test-result.json | head -5
          else
            echo "❌ Cookie non fonctionnel"
            cat test-result.json
          fi
        else
          echo "❌ Aucun cookie généré"
          exit 1
        fi
        
    - name: Upload cookie as artifact
      uses: actions/upload-artifact@v4
      with:
        name: cas-cookie
        path: .cookie
        retention-days: 1
        
    - name: Display instructions
      run: |
        echo "🎯 Cookie CAS généré avec succès !"
        echo "📁 Le cookie est disponible en tant qu'artifact"
        echo "🔄 Pour l'utiliser dans Lovable :"
        echo "   1. Télécharge l'artifact 'cas-cookie'"
        echo "   2. Copie le contenu du fichier .cookie"
        echo "   3. Colle-le dans l'interface de test CAS"