name: AI Quality Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-analysis:
    runs-on: ubuntu-latest
    name: AI Code Quality Analysis
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test -- --coverage --run
        continue-on-error: true
        
      - name: Analyze critical files with AI
        run: |
          # Analyser les fichiers critiques
          FILES=(
            "src/integrations/supabase/client.ts"
            "src/hooks/useEdnItem.ts"
            "supabase/functions/med-mng-api/auth.ts"
          )
          
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "Analyzing $file..."
              CODE=$(cat "$file" | jq -Rs .)
              
              curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/ai-code-analysis" \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                -H "Content-Type: application/json" \
                -d "{\"code\": $CODE, \"filePath\": \"$file\"}"
            fi
          done
          
      - name: Generate quality badge data
        id: quality
        run: |
          # Récupérer les derniers résultats d'analyse
          RESPONSE=$(curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_latest_quality_metrics" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          echo "quality_data=$RESPONSE" >> $GITHUB_OUTPUT
          
      - name: Update quality badges
        run: |
          echo "Quality metrics updated. See project dashboard for details."

  visual-analysis:
    runs-on: ubuntu-latest
    name: AI Visual Regression Analysis
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        
      - name: Capture screenshots
        run: |
          # Démarrer le serveur de preview
          npm run preview &
          SERVER_PID=$!
          sleep 5
          
          # Capturer les screenshots des pages principales
          npx playwright screenshot http://localhost:4173/ homepage.png
          npx playwright screenshot http://localhost:4173/dashboard dashboard.png
          
          kill $SERVER_PID
          
      - name: Analyze screenshots with AI
        run: |
          # Convertir et analyser chaque screenshot
          for screenshot in *.png; do
            if [ -f "$screenshot" ]; then
              echo "Analyzing $screenshot..."
              BASE64=$(base64 -w 0 "$screenshot")
              
              curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/ai-visual-analysis" \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
                -H "Content-Type: application/json" \
                -d "{\"screenshotBase64\": \"$BASE64\", \"componentName\": \"$screenshot\"}"
            fi
          done
          
      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-analysis-screenshots
          path: "*.png"
          retention-days: 30

  security-scan:
    runs-on: ubuntu-latest
    name: Security Vulnerability Scan
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit
        run: npm audit --json > audit.json || true
        
      - name: Analyze security issues with AI
        run: |
          AUDIT_DATA=$(cat audit.json | jq -Rs .)
          
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/ai-code-analysis" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"code\": $AUDIT_DATA, \"filePath\": \"security-audit\"}"
