name: 🚀 Complétion des compétences OIC UNESS

on:
  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Forcer la mise à jour de toutes les compétences'
        required: false
        default: 'false'
        type: boolean
      
  # Déclenchement automatique hebdomadaire (dimanche 2h du matin)
  schedule:
    - cron: '0 2 * * 0'

jobs:
  diagnostic-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: 🔍 Test API MediaWiki accessibilité
      run: |
        echo "🔍 Test API MediaWiki (1 résultat) ..."
        curl -s 'https://livret.uness.fr/lisa/2025/api.php?action=query&list=categorymembers&cmtitle=Catégorie:Objectif_de_connaissance&cmlimit=1&format=json&origin=*' | jq .
        
    - name: 📄 Test batch de 50 pages
      run: |
        echo "📄 Test 50 pages avec prop=revisions ..."
        # Récupère 50 pageids depuis la première requête
        IDS=$(curl -s 'https://livret.uness.fr/lisa/2025/api.php?action=query&list=categorymembers&cmtitle=Catégorie:Objectif_de_connaissance&cmlimit=50&format=json&origin=*' | jq -r '.query.categorymembers[].pageid' | paste -sd'|' -)
        echo "🔢 Page IDs récupérés: $IDS"
        if [ -n "$IDS" ]; then
          echo "📖 Test récupération contenu de $IDS ..."
          curl -s "https://livret.uness.fr/lisa/2025/api.php?action=query&prop=revisions&rvprop=content|timestamp&format=json&origin=*&pageids=${IDS}&formatversion=2" | jq '.query.pages | length'
        else
          echo "❌ Aucun ID récupéré - problème avec la catégorie"
        fi

  extract-oic-completion:
    runs-on: ubuntu-latest
    needs: diagnostic-api
    timeout-minutes: 60
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📦 Install dependencies (extraction only)
      run: |
        npm install --no-save puppeteer @supabase/supabase-js dotenv typescript @types/node
        npm install -g tsx
        
    - name: 📁 Create cache directory
      run: mkdir -p .cache
        
    - name: 🔐 Generate CAS cookies with Puppeteer
      env:
        CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
        CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
      run: |
        echo "🔐 Démarrage authentification CAS..."
        tsx scripts/auth/generate-cas-cookie.ts
        
        # Vérifier que les cookies ont été générés
        if [ ! -f .cache/cookies.txt ]; then
          echo "❌ Erreur: fichier cookies non généré"
          ls -la .cache/
          exit 1
        fi
        
        echo "✅ Cookies CAS générés avec succès"
        
    - name: 🚀 Run OIC extraction with completion logic
      env:
        SUPABASE_URL: https://yaincoxihiqdksxgrsrk.supabase.co
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        FORCE_UPDATE: ${{ github.event.inputs.force_update }}
      run: |
        echo "🚀 Démarrage extraction OIC avec logique de complétion..."
        
        # Utiliser le script TypeScript moderne
        echo "📜 Utilisation du script TypeScript moderne"
        tsx scripts/extract-oic.ts
        
        # Vérifier que le rapport a été généré
        if [ ! -f .cache/extraction-success.json ] && [ ! -f .cache/extraction-error.json ]; then
          echo "❌ Erreur: aucun rapport d'extraction généré"
          ls -la .cache/
          exit 1
        fi
        
        echo "✅ Extraction OIC terminée avec succès"
        
    - name: 📊 Display completion report
      run: |
        echo "📊 Rapport de complétion:"
        if [ -f .cache/extraction-success.json ]; then
          echo "✅ Succès:"
          cat .cache/extraction-success.json | jq '.'
        fi
        
        if [ -f .cache/extraction-error.json ]; then
          echo "❌ Erreurs:"
          cat .cache/extraction-error.json | jq '.'
        fi
        
        echo "📁 Contenu du cache:"
        ls -la .cache/
        
    - name: 📤 Upload completion artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: oic-completion-${{ github.run_number }}
        path: |
          .cache/
        retention-days: 30
        
    - name: 💬 Comment PR with completion stats (if triggered by PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            let reportContent = '';
            
            if (fs.existsSync('.cache/extraction-success.json')) {
              const successReport = JSON.parse(fs.readFileSync('.cache/extraction-success.json', 'utf8'));
              reportContent = `
            ## ✅ Complétion OIC - Rapport de succès
            
            **📊 Statistiques:**
            - **Compétences traitées:** ${successReport.stats?.processed || 'N/A'}
            - **Compétences mises à jour:** ${successReport.stats?.updated || 'N/A'}
            - **Compétences ignorées (déjà complètes):** ${successReport.stats?.skipped || 'N/A'}
            - **Erreurs:** ${successReport.stats?.errors || 0}
            
            **⏰ Timestamp:** ${successReport.timestamp}
            **✅ Statut:** Succès total
            `;
            } else if (fs.existsSync('.cache/extraction-error.json')) {
              const errorReport = JSON.parse(fs.readFileSync('.cache/extraction-error.json', 'utf8'));
              reportContent = `
            ## ❌ Complétion OIC - Rapport d'erreur
            
            **❌ Erreur:** ${errorReport.error}
            **⏰ Timestamp:** ${errorReport.timestamp}
            **✅ Statut:** Échec
            `;
            }
            
            if (reportContent) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: reportContent
              });
            }
          } catch (error) {
            console.log('Erreur lecture rapport:', error);
          }
          
    - name: 🚨 Notify on failure
      if: failure()
      run: |
        echo "❌ La complétion OIC a échoué"
        echo "📧 Vérifiez les artefacts pour plus de détails"
        
        if [ -f .cache/auth-error.log ]; then
          echo "🔐 Erreur d'authentification:"
          cat .cache/auth-error.log
        fi
        
        if [ -f .cache/extraction-error.log ]; then
          echo "📊 Erreur d'extraction:"
          cat .cache/extraction-error.log
        fi

  # Job optionnel pour valider la qualité des données après complétion
  validate-completion:
    runs-on: ubuntu-latest
    needs: extract-oic-completion
    if: always()
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📊 Download completion artifacts
      uses: actions/download-artifact@v4
      with:
        name: oic-completion-${{ github.run_number }}
        path: .cache/
        
    - name: ✅ Validate completion quality
      env:
        SUPABASE_URL: https://yaincoxihiqdksxgrsrk.supabase.co
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        npm install @supabase/supabase-js
        
        # Script de validation de la complétion
        cat << 'EOF' > validate-completion.js
        const { createClient } = require('@supabase/supabase-js');
        
        async function validateCompletion() {
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );
          
          // Compter les compétences avec descriptions vides
          const { data: emptyDesc, error: errorEmpty } = await supabase
            .from('backup_oic_competences')
            .select('objectif_id', { count: 'exact' })
            .or('description.is.null,description.eq.');
          
          // Compter le total des compétences
          const { count: totalCount, error: errorTotal } = await supabase
            .from('backup_oic_competences')
            .select('*', { count: 'exact', head: true });
          
          const emptyCount = emptyDesc?.length || 0;
          const completionRate = totalCount ? ((totalCount - emptyCount) / totalCount * 100).toFixed(2) : 0;
          
          console.log(`📊 Validation de la complétion:`);
          console.log(`   - Total compétences: ${totalCount || 0}`);
          console.log(`   - Compétences incomplètes: ${emptyCount}`);
          console.log(`   - Taux de complétion: ${completionRate}%`);
          
          if (emptyCount > 100) {
            console.log('⚠️  Beaucoup de compétences incomplètes détectées');
          } else if (emptyCount === 0) {
            console.log('🎉 Toutes les compétences sont complètes !');
          } else {
            console.log('✅ Qualité de complétion acceptable');
          }
        }
        
        validateCompletion().catch(console.error);
        EOF
        
        node validate-completion.js