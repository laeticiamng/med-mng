name: 🚀 Complétion des compétences OIC UNESS

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Forcer la mise à jour de toutes les compétences'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '0 2 * * 0'   # dim. 02 h 00

jobs:
  oic-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Install deps
      run: |
        npm ci            # package-lock.json déjà présent
        # Si besoin : npm i puppeteer @supabase/supabase-js dotenv

    - name: 🚀 Run extraction / completion
      env:
        SUPABASE_URL: https://yaincoxihiqdksxgrsrk.supabase.co
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
        CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
        FORCE_UPDATE: ${{ github.event.inputs.force_update }}
      run: |
        mkdir -p .cache
        node extract-oic-competences.cjs
        
    - name: 📤 Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extraction-report-${{ github.run_number }}
        path: |
          .cache/
          rapport-*.json
          extraction-*.log