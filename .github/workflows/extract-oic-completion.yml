
name: 🚀 Extraction complète des compétences OIC UNESS

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Forcer la mise à jour de toutes les compétences'
        required: false
        default: 'false'
        type: boolean
      batch_size:
        description: 'Taille des batches (défaut: 500)'
        required: false
        default: '500'
        type: string
  schedule:
    - cron: '0 2 * * 0'   # Dimanche 02h00

jobs:
  extract-oic-competences:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Augmenté pour 4,872 compétences
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: ℹ️ Install system dependencies for Chromium
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm-dev libxshmfence-dev libnss3-dev libxss1 libasound2

    - name: 📦 Install OIC dependencies
      working-directory: oic-scripts
      run: npm install

    - name: 🚀 Run OIC extraction with CAS authentication
      working-directory: oic-scripts
      env:
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
        CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
        FORCE_UPDATE: ${{ github.event.inputs.force_update }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      run: |
        echo "🚀 Démarrage extraction OIC - 4,872 compétences attendues"
        echo "🔐 Variables d'environnement configurées"
        echo "📊 Force update: ${FORCE_UPDATE}"
        echo "📦 Batch size: ${BATCH_SIZE:-500}"
        
        # Créer le dossier cache
        mkdir -p .cache
        
        # Lancer l'extraction avec timeout approprié
        timeout 7200 node extract-oic-competences.cjs || {
          echo "❌ Timeout ou erreur lors de l'extraction"
          exit 1
        }
        
    - name: 📊 Generate extraction summary
      if: always()
      working-directory: oic-scripts
      run: |
        echo "📈 RÉSUMÉ DE L'EXTRACTION OIC" > extraction-summary.txt
        echo "=================================" >> extraction-summary.txt
        echo "Date: $(date)" >> extraction-summary.txt
        echo "Workflow run: ${{ github.run_number }}" >> extraction-summary.txt
        echo "" >> extraction-summary.txt
        
        # Vérifier les fichiers générés
        if [ -f .cache/extraction-report.json ]; then
          echo "📊 Rapport d'extraction trouvé" >> extraction-summary.txt
          echo "Taille: $(stat -c%s .cache/extraction-report.json) bytes" >> extraction-summary.txt
        else
          echo "❌ Pas de rapport d'extraction généré" >> extraction-summary.txt
        fi
        
        # Lister les fichiers de cache
        echo "" >> extraction-summary.txt
        echo "📁 Fichiers générés:" >> extraction-summary.txt
        ls -la .cache/ >> extraction-summary.txt 2>/dev/null || echo "Aucun fichier cache" >> extraction-summary.txt
        
        cat extraction-summary.txt

    - name: 📤 Upload extraction artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extraction-report-${{ github.run_number }}
        path: |
          oic-scripts/.cache/
          oic-scripts/extraction-*.json
          oic-scripts/extraction-summary.txt
          oic-scripts/*.log
        retention-days: 30

    - name: 💾 Create release on success
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: oic-extraction-${{ github.run_number }}
        release_name: Extraction OIC - Run ${{ github.run_number }}
        body: |
          🚀 Extraction automatique des compétences OIC UNESS
          
          **Détails de l'extraction:**
          - Date: ${{ github.event.repository.pushed_at }}
          - Workflow: ${{ github.run_number }}
          - Compétences attendues: 4,872
          - Force update: ${{ github.event.inputs.force_update }}
          - Batch size: ${{ github.event.inputs.batch_size || '500' }}
          
          **Authentification:**
          - ✅ Authentification CAS UNESS réussie
          - ✅ Cookies de session récupérés
          - ✅ API MediaWiki accessible
          
          Voir les artifacts pour le rapport détaillé.
        draft: false
        prerelease: false

    - name: 🔍 Post-extraction validation
      if: success()
      working-directory: oic-scripts
      run: |
        echo "🔍 Validation post-extraction..."
        
        # Vérifier si le rapport existe
        if [ -f .cache/extraction-report.json ]; then
          echo "✅ Rapport d'extraction généré avec succès"
          
          # Afficher les statistiques principales
          if command -v jq &> /dev/null; then
            echo "📊 Statistiques extraites:"
            jq -r '.summary // empty' .cache/extraction-report.json || echo "Pas de résumé disponible"
          fi
        else
          echo "⚠️ Pas de rapport d'extraction trouvé"
        fi
        
        echo "🎉 Validation terminée"
