name: 🤖 Extraction OIC Autonome

on:
  schedule:
    # Tous les lundis à 3h du matin UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permet le déclenchement manuel
  
env:
  CAS_USERNAME: laeticia.moto-ngane@etud.u-picardie.fr
  CAS_PASSWORD: Aiciteal1!
  SUPABASE_URL: https://yaincoxihiqdksxgrsrk.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  extract-oic-competences:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📦 Install dependencies
        run: |
          npm install puppeteer @supabase/supabase-js dotenv crypto
          
      - name: 🔍 Verify extraction script
        run: |
          if [ ! -f "scripts/extract-oic-competences.cjs" ]; then
            echo "📝 Création du script d'extraction..."
            mkdir -p scripts
          fi
          
      - name: 🚀 Execute OIC extraction
        id: extraction
        run: |
          echo "🤖 Démarrage extraction autonome OIC..."
          echo "📊 Target: 4,872 compétences"
          echo "🎯 Table: backup_oic_competences"
          
          node scripts/extract-oic-competences.cjs
          
          echo "✅ Extraction terminée"
          
      - name: 📊 Generate extraction report
        run: |
          echo "📋 Génération du rapport d'extraction..."
          
          if [ -f "reports/oic_extraction_report.json" ]; then
            echo "📈 Rapport généré avec succès"
            cat reports/oic_extraction_report.json
          else
            echo "⚠️ Aucun rapport trouvé"
          fi
          
      - name: 📤 Upload extraction report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oic-extraction-report-${{ github.run_number }}
          path: |
            reports/oic_extraction_report.json
            logs/extraction-*.log
          retention-days: 30
          
      - name: 💬 Notify completion
        if: always()
        run: |
          if [ "${{ steps.extraction.outcome }}" = "success" ]; then
            echo "🎉 Extraction OIC réussie - ${{ github.run_number }}"
          else
            echo "💥 Échec extraction OIC - ${{ github.run_number }}"
          fi