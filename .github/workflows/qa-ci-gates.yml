name: QA & CI Gates

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  lint_typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck

  vitest_coverage:
    name: Vitest Coverage
    runs-on: ubuntu-latest
    needs: lint_typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit and integration tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage
          retention-days: 14

  cypress_e2e:
    name: Cypress E2E Journeys
    runs-on: ubuntu-latest
    needs: vitest_coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Start preview server
        run: pnpm preview --host 0.0.0.0 --port 4173 &
      - name: Wait for preview
        run: npx wait-on http://127.0.0.1:4173
      - name: Run Cypress suites
        run: pnpm test:e2e:cypress
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4173
      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 14

  lighthouse:
    name: Lighthouse Budgets
    runs-on: ubuntu-latest
    needs: vitest_coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Run Lighthouse audits
        run: pnpm lighthouse:ci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse
          retention-days: 14

  preview_artifact:
    name: Preview Artifact
    runs-on: ubuntu-latest
    needs: [cypress_e2e, lighthouse]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        run: pnpm build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: med-mng-preview
          path: dist
          retention-days: 7
