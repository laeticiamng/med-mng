name: SonarQube Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonarqube:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test -- --coverage
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run ESLint for SonarQube
        run: npm run lint -- --format json --output-file eslint-report.json
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        continue-on-error: true

      - name: Upload SonarQube results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-reports
          path: |
            .scannerwork/
            eslint-report.json
            coverage/
          retention-days: 30

      - name: Comment PR with SonarQube results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const qualityGate = '${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}';
            const projectKey = 'medmng-platform'; // À adapter selon votre projet
            const sonarUrl = process.env.SONAR_HOST_URL || 'https://sonarcloud.io';
            
            let comment = '## 🔍 SonarQube Analysis Results\n\n';
            
            if (qualityGate === 'PASSED') {
              comment += '✅ **Quality Gate: PASSED**\n\n';
            } else if (qualityGate === 'FAILED') {
              comment += '❌ **Quality Gate: FAILED**\n\n';
            } else {
              comment += '⚠️ **Quality Gate: PENDING**\n\n';
            }
            
            comment += `[View detailed report on SonarQube](${sonarUrl}/dashboard?id=${projectKey})\n\n`;
            comment += '### Metrics\n';
            comment += '- Code Coverage\n';
            comment += '- Code Smells\n';
            comment += '- Bugs\n';
            comment += '- Security Hotspots\n';
            comment += '- Duplications\n';
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  code-quality-summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: sonarqube
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "📊 Code Quality Analysis Complete"
          echo "================================="
          echo "SonarQube: ${{ needs.sonarqube.result }}"
          echo ""
          echo "Check the detailed reports in artifacts"
