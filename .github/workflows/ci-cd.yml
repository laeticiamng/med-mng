name: CI/CD Pipeline - MedMng Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🔍 QUALITY CHECKS
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🧹 Lint code
        run: npm run lint

      - name: 🔨 Build application
        run: npm run build

      - name: 🧪 Run unit tests
        run: npm run test

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        if: success()

  # 🔒 SECURITY SCAN
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🔐 Audit npm dependencies
        run: npm audit --audit-level=high

  # 🎭 E2E TESTS
  e2e-tests:
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright
        run: npx playwright install --with-deps

      - name: 🚀 Build application
        run: npm run build

      - name: 🌐 Start preview server
        run: npm run preview &
        
      - name: ⏳ Wait for server
        run: npx wait-on http://localhost:4173

      - name: 🧪 Run E2E tests
        run: npm run test:e2e

      - name: 📸 Upload test artifacts
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  # 🧪 DATABASE MIGRATION VERIFICATION
  db-migration-verification:
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.ref == 'refs/heads/main' && secrets.TEST_SUPABASE_DB_URL != ''
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 🛠 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 📦 Apply migrations on test database
        id: test_db_migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: ./scripts/db_migrate.sh test

      - name: 🔁 Rollback migrations on test database
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.TEST_SUPABASE_DB_URL }}
        run: ./scripts/db_rollback.sh test

  # 🏗️ BUILD & DEPLOY STAGING
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan, e2e-tests]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🚀 Build for staging
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: 🛠 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🗄️ Run database migrations (staging)
        id: staging_db_migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: ./scripts/db_migrate.sh staging

      - name: 🔁 Rollback database on failure (staging)
        if: failure() && steps.staging_db_migrate.outcome == 'failure'
        env:
          SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
        run: ./scripts/db_rollback.sh staging

      - name: 🐳 Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push staging image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: 🚀 Deploy to staging
        run: |
          echo "🎯 Deploying to staging environment..."
          # Add your staging deployment logic here

      - name: 📧 Notify staging deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: "🚀 Staging deployment ${{ job.status }} for commit ${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 🏭 PRODUCTION DEPLOYMENT
  deploy-production:
    runs-on: ubuntu-latest
    needs: [quality-checks, security-scan, e2e-tests]
    if: github.event_name == 'release'
    environment: production
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🚀 Build for production
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

      - name: 🛠 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🗄️ Run database migrations (production)
        id: production_db_migrate
        env:
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: ./scripts/db_migrate.sh production

      - name: 🔁 Rollback database on failure (production)
        if: failure() && steps.production_db_migrate.outcome == 'failure'
        env:
          SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
        run: ./scripts/db_rollback.sh production

      - name: 🐳 Build production Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push production images
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: 🚀 Deploy to production
        run: |
          echo "🎯 Deploying to production environment..."
          # Add your production deployment logic here

      - name: 📧 Notify production deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: "🏭 Production deployment ${{ job.status }} for release ${{ github.ref_name }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 📊 AUDIT & REPORTING
  audit-report:
    runs-on: ubuntu-latest
    if: always()
    needs: [quality-checks, security-scan, e2e-tests]
    steps:
      - name: 🛒 Checkout code
        uses: actions/checkout@v4

      - name: 📊 Generate audit report
        run: |
          echo "# 📊 Pipeline Audit Report" > audit-report.md
          echo "- **Build Status**: ${{ needs.quality-checks.result }}" >> audit-report.md
          echo "- **Security Scan**: ${{ needs.security-scan.result }}" >> audit-report.md
          echo "- **E2E Tests**: ${{ needs.e2e-tests.result }}" >> audit-report.md
          echo "- **Commit**: ${{ github.sha }}" >> audit-report.md
          echo "- **Branch**: ${{ github.ref_name }}" >> audit-report.md
          echo "- **Triggered by**: ${{ github.actor }}" >> audit-report.md

      - name: 📤 Upload audit report
        uses: actions/upload-artifact@v3
        with:
          name: audit-report
          path: audit-report.md

      - name: 💬 Comment PR with audit
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const auditReport = fs.readFileSync('audit-report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Automated Audit Report\n\n${auditReport}`
            });

  # 🔄 BRANCH PROTECTION
  branch-protection-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: ✅ All checks passed
        run: echo "All required checks passed for PR merge"
