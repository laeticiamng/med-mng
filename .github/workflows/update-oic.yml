name: 🚀 Extraction OIC UNESS avec Puppeteer

on:
  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Forcer la mise à jour de toutes les compétences'
        required: false
        default: 'false'
        type: boolean
      
  # Déclenchement automatique hebdomadaire (lundi 3h du matin)
  schedule:
    - cron: '0 3 * * 1'

jobs:
  extract-oic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: |
        npm install puppeteer @supabase/supabase-js typescript @types/node
        npm install -g tsx
        
    - name: 🔐 Generate CAS cookies with Puppeteer
      env:
        CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
        CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
      run: |
        echo "🔐 Démarrage authentification CAS..."
        tsx scripts/auth/generate-cas-cookie.ts
        
        # Vérifier que les cookies ont été générés
        if [ ! -f .cache/cookies.txt ]; then
          echo "❌ Erreur: fichier cookies non généré"
          exit 1
        fi
        
        echo "✅ Cookies CAS générés avec succès"
        
    - name: 📊 Extract OIC competences
      env:
        SUPABASE_URL: https://yaincoxihiqdksxgrsrk.supabase.co
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        FORCE_UPDATE: ${{ github.event.inputs.force_update }}
      run: |
        echo "📊 Démarrage extraction OIC..."
        tsx scripts/extract-oic.ts
        
        # Vérifier que le rapport a été généré
        if [ ! -f .cache/extraction-report.json ]; then
          echo "❌ Erreur: rapport d'extraction non généré"
          exit 1
        fi
        
        echo "✅ Extraction OIC terminée avec succès"
        
    - name: 📋 Display extraction report
      run: |
        echo "📊 Rapport d'extraction:"
        cat .cache/extraction-report.json | jq '.'
        
    - name: 📤 Upload extraction artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: oic-extraction-${{ github.run_number }}
        path: |
          .cache/
        retention-days: 7
        
    - name: 💬 Comment PR (if triggered by PR)
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const report = JSON.parse(fs.readFileSync('.cache/extraction-report.json', 'utf8'));
            const comment = `
          ## 🚀 Extraction OIC - Rapport automatique
          
          **📊 Statistiques:**
          - **Total pages OIC:** ${report.stats.total_pages}
          - **Pages traitées:** ${report.stats.processed}
          - **Compétences mises à jour:** ${report.stats.updated}
          - **Erreurs:** ${report.stats.errors}
          - **Ignorées (déjà complètes):** ${report.stats.skipped}
          
          **⏰ Timestamp:** ${report.timestamp}
          **🎯 Méthode:** ${report.method}
          **✅ Statut:** ${report.success ? 'Succès' : 'Échec'}
          `;
          
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Erreur lecture rapport:', error);
          }
          
    - name: 🚨 Notify on failure
      if: failure()
      run: |
        echo "❌ L'extraction OIC a échoué"
        echo "📧 Notification d'échec (à configurer si besoin)"
        
        # Ici on pourrait ajouter une notification Slack, email, etc.
        # curl -X POST -H 'Content-type: application/json' \
        # --data '{"text":"🚨 Extraction OIC échouée dans ${{ github.repository }}"}' \
        # ${{ secrets.SLACK_WEBHOOK_URL }}

  # Job optionnel pour valider la qualité des données
  validate-data:
    runs-on: ubuntu-latest
    needs: extract-oic
    if: always()
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 📊 Download extraction artifacts
      uses: actions/download-artifact@v4
      with:
        name: oic-extraction-${{ github.run_number }}
        path: .cache/
        
    - name: ✅ Validate extraction quality
      env:
        SUPABASE_URL: https://yaincoxihiqdksxgrsrk.supabase.co
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        npm install @supabase/supabase-js
        
        # Script de validation rapide
        cat << 'EOF' > validate.js
        const { createClient } = require('@supabase/supabase-js');
        
        async function validate() {
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );
          
          const { data, error } = await supabase
            .from('backup_oic_competences')
            .select('objectif_id, description')
            .is('description', null)
            .or('description.eq.');
          
          const incompletes = data?.length || 0;
          console.log(`📊 Compétences sans description: ${incompletes}`);
          
          if (incompletes > 50) {
            console.log('⚠️  Beaucoup de compétences incomplètes détectées');
          } else {
            console.log('✅ Qualité des données acceptable');
          }
        }
        
        validate().catch(console.error);
        EOF
        
        node validate.js