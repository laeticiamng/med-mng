# Rapport en lecture seule sur la protection de la branche main.
#
# Lancement manuel uniquement. N'utilise que le GITHUB_TOKEN fourni par Actions, en
# lecture (contents: read) ; ne crée ni ne modifie rien (plus de création d'issue, qui
# exigeait issues: write) et n'échoue pas pour une permission manquante.
#
# Ce que le GITHUB_TOKEN peut lire :
#   - GET /repos/{dépôt}/branches/main          : protégée ou non, checks requis ;
#   - GET /repos/{dépôt}/rules/branches/main    : règles des rulesets actives sur main.
# Ce qu'il ne peut pas lire : GET /repos/{dépôt}/branches/main/protection (détail : revues,
# enforce_admins) exige la permission « Administration », qu'aucun GITHUB_TOKEN ne peut
# recevoir. Ce détail est signalé comme « non lisible » au lieu de faire échouer le job.
#
# Rappel : Lovable pousse directement sur main. Une protection qui exige une pull request
# ou des checks réussis avant chaque push bloquerait la synchronisation Lovable.
name: Rapport de protection de la branche main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-protection:
    name: Lire la protection de main
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Lire la configuration (lecture seule)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          # Nom du job de .github/workflows/verification.yml (nom du check affiché sur les PR).
          CHECK_CI: Tests, types et build
        run: |
          set -u
          resume() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          resume "# Protection de la branche main"
          resume ""

          if ! BRANCHE=$(gh api "repos/$DEPOT/branches/main" 2>&1); then
            echo "::warning::Lecture de la branche main impossible : $BRANCHE"
            resume "Lecture de la branche main impossible avec le GITHUB_TOKEN : \`$BRANCHE\`"
            exit 0
          fi

          PROTEGEE=$(echo "$BRANCHE" | jq -r '.protected')
          NIVEAU=$(echo "$BRANCHE" | jq -r '.protection.required_status_checks.enforcement_level // "off"')
          CHECKS=$(echo "$BRANCHE" | jq -r '[(.protection.required_status_checks.contexts // [])[], ((.protection.required_status_checks.checks // [])[] | .context)] | unique | .[]')

          RULESETS="non lisible"
          if REGLES=$(gh api "repos/$DEPOT/rules/branches/main" 2>/dev/null); then
            RULESETS=$(echo "$REGLES" | jq -r '[.[].type] | unique | join(", ") | if . == "" then "aucune" else . end')
            CHECKS_RS=$(echo "$REGLES" | jq -r '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')
            CHECKS=$(printf '%s\n%s\n' "$CHECKS" "$CHECKS_RS" | sed '/^$/d' | sort -u)
          fi

          resume "| Élément | Valeur |"
          resume "|---|---|"
          resume "| Branche protégée (règle classique) | $PROTEGEE |"
          resume "| Application des checks requis | $NIVEAU |"
          resume "| Règles de rulesets actives | $RULESETS |"
          resume "| Checks requis | $( [ -n "$CHECKS" ] && echo "$CHECKS" | paste -sd ';' - | sed 's/;/ ; /g' || echo aucun ) |"

          if DETAIL=$(gh api "repos/$DEPOT/branches/main/protection" 2>&1); then
            REVUES=$(echo "$DETAIL" | jq -r '.required_pull_request_reviews.required_approving_review_count // 0')
            ADMINS=$(echo "$DETAIL" | jq -r '.enforce_admins.enabled // false')
            resume "| Revues requises | $REVUES |"
            resume "| Règles imposées aux administrateurs | $ADMINS |"
          elif grep -q "Branch not protected" <<< "$DETAIL"; then
            resume "| Revues requises | sans objet (branche non protégée) |"
          else
            echo "::notice::Détail de la protection non lisible avec le GITHUB_TOKEN (permission Administration requise). Le reste du rapport est complet."
            resume "| Revues requises, règles admins | non lisibles avec le GITHUB_TOKEN (permission Administration requise) |"
          fi

          resume ""
          if grep -qxF "$CHECK_CI" <<< "$CHECKS"; then
            resume "Le check « $CHECK_CI » (verification.yml) est requis sur main."
          else
            echo "::notice::Le check « $CHECK_CI » (verification.yml) n'est pas requis sur main : information seulement."
            resume "Le check « $CHECK_CI » (verification.yml) n'est pas requis sur main. Le rendre obligatoire bloquerait aussi les pushs directs de Lovable tant que le check n'a pas réussi : à décider en connaissance de cause."
          fi
