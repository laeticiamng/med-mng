name: Weekly OIC Extraction (Autonomous)

on:
  schedule:
    # Tous les lundis à 3h du matin UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:  # Permet lancement manuel
    inputs:
      force_extraction:
        description: 'Forcer une extraction complète même si les données sont récentes'
        required: false
        default: 'false'
        type: boolean

jobs:
  autonomous-oic-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 1 heure max
    
    env:
      SUPABASE_URL: https://yaincoxihiqdksxgrsrk.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
      CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install --production
        npm install puppeteer @supabase/supabase-js axios fs-extra
        
    - name: Verify credentials and environment
      run: |
        echo "🔍 Vérification de l'environnement..."
        
        if [ -z "$CAS_USERNAME" ]; then
          echo "❌ CAS_USERNAME manquant dans les secrets GitHub"
          exit 1
        fi
        
        if [ -z "$CAS_PASSWORD" ]; then
          echo "❌ CAS_PASSWORD manquant dans les secrets GitHub"
          exit 1
        fi
        
        if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
          echo "❌ SUPABASE_SERVICE_ROLE_KEY manquant dans les secrets GitHub"
          exit 1
        fi
        
        echo "✅ Tous les credentials sont configurés"
        echo "🔐 Utilisateur CAS: ${CAS_USERNAME:0:10}***"
        echo "🔗 Supabase URL: $SUPABASE_URL"
        
    - name: Check current OIC data state
      id: check_data
      run: |
        echo "📊 Vérification de l'état actuel des données OIC..."
        
        cat > check_oic_state.js << 'EOF'
        const { createClient } = require('@supabase/supabase-js');
        
        async function checkOICState() {
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );
          
          try {
            // Compter les compétences existantes
            const { count, error } = await supabase
              .from('backup_oic_competences')
              .select('*', { count: 'exact', head: true });
              
            if (error) throw error;
            
            console.log(`📈 Compétences actuelles en base: ${count || 0}`);
            
            // Vérifier les données incomplètes
            const { data: incomplete, error: incompleteError } = await supabase
              .from('backup_oic_competences')
              .select('objectif_id')
              .or('intitule.is.null,description.is.null,rubrique.is.null')
              .limit(100);
              
            if (incompleteError) throw incompleteError;
            
            const incompleteCount = incomplete?.length || 0;
            console.log(`⚠️ Compétences incomplètes: ${incompleteCount}`);
            
            // Vérifier la dernière extraction
            const { data: lastUpdate, error: updateError } = await supabase
              .from('backup_oic_competences')
              .select('updated_at')
              .order('updated_at', { ascending: false })
              .limit(1);
              
            if (updateError) throw updateError;
            
            const lastUpdateDate = lastUpdate?.[0]?.updated_at;
            const daysSinceUpdate = lastUpdateDate ? 
              Math.floor((Date.now() - new Date(lastUpdateDate)) / (1000 * 60 * 60 * 24)) : 999;
            
            console.log(`📅 Dernière mise à jour: ${lastUpdateDate || 'jamais'}`);
            console.log(`⏰ Jours depuis dernière MAJ: ${daysSinceUpdate}`);
            
            // Décider si extraction nécessaire
            const forceExtraction = process.env.FORCE_EXTRACTION === 'true';
            const needsExtraction = forceExtraction || 
                                   count < 4500 || // Moins de 4500 compétences
                                   incompleteCount > 100 || // Plus de 100 incomplètes
                                   daysSinceUpdate > 7; // Plus d'une semaine
            
            console.log(`🎯 Extraction nécessaire: ${needsExtraction ? 'OUI' : 'NON'}`);
            
            if (!needsExtraction) {
              console.log('✅ Données OIC suffisamment récentes et complètes');
              console.log('::set-output name=extraction_needed::false');
            } else {
              console.log('🚀 Extraction nécessaire - démarrage du processus');
              console.log('::set-output name=extraction_needed::true');
            }
            
            console.log(`::set-output name=current_count::${count || 0}`);
            console.log(`::set-output name=incomplete_count::${incompleteCount}`);
            console.log(`::set-output name=days_since_update::${daysSinceUpdate}`);
            
          } catch (error) {
            console.error('❌ Erreur vérification état:', error.message);
            // En cas d'erreur, forcer l'extraction
            console.log('::set-output name=extraction_needed::true');
            console.log('::set-output name=current_count::0');
          }
        }
        
        checkOICState();
        EOF
        
        node check_oic_state.js
      env:
        FORCE_EXTRACTION: ${{ github.event.inputs.force_extraction }}
        
    - name: Run autonomous OIC extraction
      if: steps.check_data.outputs.extraction_needed == 'true'
      run: |
        echo "🚀 Démarrage de l'extraction autonome des compétences OIC..."
        echo "📋 État actuel: ${{ steps.check_data.outputs.current_count }} compétences"
        echo "⚠️ Incomplètes: ${{ steps.check_data.outputs.incomplete_count }}"
        echo "📅 Jours depuis MAJ: ${{ steps.check_data.outputs.days_since_update }}"
        
        # Utiliser le script existant extract-oic-competences.cjs
        timeout 3600 node extract-oic-competences.cjs 2>&1 | tee extraction.log
        
        if [ $? -eq 0 ]; then
          echo "✅ Extraction réussie"
        else
          echo "❌ Extraction échouée - voir extraction.log"
          exit 1
        fi
        
    - name: Generate extraction report
      if: always()
      run: |
        echo "📋 Génération du rapport d'extraction..."
        
        cat > generate_report.js << 'EOF'
        const { createClient } = require('@supabase/supabase-js');
        const fs = require('fs');
        
        async function generateReport() {
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );
          
          try {
            // Statistiques finales
            const { count: totalCount, error: countError } = await supabase
              .from('backup_oic_competences')
              .select('*', { count: 'exact', head: true });
              
            if (countError) throw countError;
            
            // Compétences par rubrique
            const { data: byRubrique, error: rubriqueError } = await supabase
              .from('backup_oic_competences')
              .select('rubrique')
              .not('rubrique', 'is', null);
              
            if (rubriqueError) throw rubriqueError;
            
            const rubriqueStats = {};
            byRubrique?.forEach(item => {
              const rubrique = item.rubrique || 'Non définie';
              rubriqueStats[rubrique] = (rubriqueStats[rubrique] || 0) + 1;
            });
            
            // Compétences incomplètes
            const { data: incomplete, error: incompleteError } = await supabase
              .from('backup_oic_competences')
              .select('objectif_id, intitule, description, rubrique')
              .or('intitule.is.null,description.is.null,rubrique.is.null');
              
            if (incompleteError) throw incompleteError;
            
            const report = {
              timestamp: new Date().toISOString(),
              extraction_date: new Date().toLocaleDateString('fr-FR'),
              total_competences: totalCount || 0,
              target_competences: 4872,
              completion_rate: Math.round(((totalCount || 0) / 4872) * 100),
              
              statistics: {
                by_rubrique: rubriqueStats,
                total_rubriques: Object.keys(rubriqueStats).length,
                incomplete_count: incomplete?.length || 0
              },
              
              quality_check: {
                has_complete_data: (totalCount || 0) >= 4500,
                has_low_incomplete: (incomplete?.length || 0) < 100,
                quality_score: Math.round((1 - ((incomplete?.length || 0) / (totalCount || 1))) * 100)
              },
              
              incomplete_samples: incomplete?.slice(0, 10).map(item => ({
                objectif_id: item.objectif_id,
                missing_fields: [
                  !item.intitule && 'intitule',
                  !item.description && 'description', 
                  !item.rubrique && 'rubrique'
                ].filter(Boolean)
              })) || [],
              
              recommendations: [
                (totalCount || 0) < 4500 ? 'Extraction incomplète - relancer l\'extraction' : null,
                (incomplete?.length || 0) > 100 ? 'Trop de données incomplètes - vérifier le parser' : null,
                Object.keys(rubriqueStats).length < 10 ? 'Mapping rubriques incomplet' : null
              ].filter(Boolean),
              
              next_extraction: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString()
            };
            
            // Sauvegarder le rapport
            fs.writeFileSync('oic_extraction_report.json', JSON.stringify(report, null, 2));
            
            console.log('📊 RAPPORT D\'EXTRACTION OIC');
            console.log('================================');
            console.log(`📅 Date: ${report.extraction_date}`);
            console.log(`📈 Total: ${report.total_competences}/${report.target_competences} (${report.completion_rate}%)`);
            console.log(`🏷️  Rubriques: ${report.statistics.total_rubriques}`);
            console.log(`⚠️ Incomplètes: ${report.statistics.incomplete_count}`);
            console.log(`💯 Score qualité: ${report.quality_check.quality_score}%`);
            
            if (report.recommendations.length > 0) {
              console.log('🎯 RECOMMANDATIONS:');
              report.recommendations.forEach((rec, i) => {
                console.log(`   ${i+1}. ${rec}`);
              });
            } else {
              console.log('✅ Qualité des données: EXCELLENTE');
            }
            
            console.log(`🔄 Prochaine extraction: ${new Date(report.next_extraction).toLocaleDateString('fr-FR')}`);
            
          } catch (error) {
            console.error('❌ Erreur génération rapport:', error.message);
            
            const errorReport = {
              timestamp: new Date().toISOString(),
              error: error.message,
              success: false
            };
            
            fs.writeFileSync('oic_extraction_report.json', JSON.stringify(errorReport, null, 2));
          }
        }
        
        generateReport();
        EOF
        
        node generate_report.js
        
    - name: Upload extraction artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: oic-extraction-${{ github.run_number }}
        path: |
          oic_extraction_report.json
          extraction.log
          extraction-*.log
          rapport-*.json
        retention-days: 30
        
    - name: Archive logs in Supabase
      if: always()
      run: |
        echo "📚 Archivage des logs d'extraction..."
        
        cat > archive_logs.js << 'EOF'
        const { createClient } = require('@supabase/supabase-js');
        const fs = require('fs');
        
        async function archiveLogs() {
          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );
          
          try {
            const report = fs.existsSync('oic_extraction_report.json') ? 
              JSON.parse(fs.readFileSync('oic_extraction_report.json', 'utf8')) : {};
              
            const extractionLog = fs.existsSync('extraction.log') ? 
              fs.readFileSync('extraction.log', 'utf8') : '';
            
            // Créer un enregistrement dans une table de logs d'extraction
            const logEntry = {
              extraction_date: new Date().toISOString(),
              extraction_type: 'weekly_autonomous',
              github_run_id: process.env.GITHUB_RUN_ID,
              github_run_number: process.env.GITHUB_RUN_NUMBER,
              total_competences: report.total_competences || 0,
              incomplete_count: report.statistics?.incomplete_count || 0,
              quality_score: report.quality_check?.quality_score || 0,
              success: !report.error,
              error_message: report.error || null,
              recommendations: report.recommendations || [],
              full_report: report,
              extraction_logs: extractionLog.slice(-10000) // Derniers 10k chars
            };
            
            // Note: Cette table devrait être créée si elle n'existe pas
            // Pour l'instant, on log juste le résumé
            console.log('📝 Résumé archivage:');
            console.log(`   🆔 Run: ${process.env.GITHUB_RUN_NUMBER}`);
            console.log(`   📊 Compétences: ${logEntry.total_competences}`);
            console.log(`   💯 Score: ${logEntry.quality_score}%`);
            console.log(`   ✅ Succès: ${logEntry.success ? 'OUI' : 'NON'}`);
            
          } catch (error) {
            console.error('❌ Erreur archivage:', error.message);
          }
        }
        
        archiveLogs();
        EOF
        
        node archive_logs.js
        
    - name: Send completion notification
      if: always()
      run: |
        echo "📢 Extraction OIC autonome terminée"
        echo "🔗 Voir les artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "📊 Status: ${{ job.status }}"
        
        if [ -f oic_extraction_report.json ]; then
          echo "📋 Rapport disponible dans les artifacts"
        fi
        
        # Future: ici on pourrait envoyer une notification Slack/Discord/Email
        # avec le résumé de l'extraction