name: Extract OIC Competences

on:
  workflow_dispatch:  # Manuel
    inputs:
      cas_cookie:
        description: 'Cookie CAS (optionnel si déjà généré)'
        required: false
        type: string
      batch_size:
        description: 'Taille des batchs'
        required: false
        default: '100'
        type: string

jobs:
  extract-competences:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install axios fs-extra
        
    - name: Generate or use existing cookie
      env:
        CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
        CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
        PROVIDED_COOKIE: ${{ github.event.inputs.cas_cookie }}
      run: |
        if [ -n "$PROVIDED_COOKIE" ]; then
          echo "🍪 Utilisation du cookie fourni"
          echo "$PROVIDED_COOKIE" > .cookie
        elif [ -f .cookie ]; then
          echo "🍪 Utilisation du cookie existant"
        else
          echo "🔐 Génération d'un nouveau cookie..."
          npm install puppeteer
          node generate-cas-cookie.js
        fi
        
    - name: Create extraction script
      run: |
        cat > extract-all-oic.js << 'EOF'
        const fs = require('fs-extra');
        const axios = require('axios');
        
        async function extractAllOIC() {
          console.log('🚀 Extraction complète des compétences OIC');
          
          // Lire le cookie
          const cookie = await fs.readFile('.cookie', 'utf8');
          console.log('🍪 Cookie CAS chargé');
          
          const batchSize = parseInt(process.env.BATCH_SIZE || '100');
          let offset = 0;
          let allCompetences = [];
          let hasMore = true;
          
          while (hasMore) {
            console.log(`📦 Batch ${Math.floor(offset/batchSize) + 1} - offset: ${offset}`);
            
            try {
              const response = await axios.get(`https://livret.uness.fr/lisa/2025/api.php`, {
                params: {
                  action: 'query',
                  list: 'categorymembers',
                  cmtitle: 'Catégorie:Objectif_de_connaissance',
                  cmlimit: batchSize,
                  cmcontinue: offset > 0 ? offset : undefined,
                  format: 'json'
                },
                headers: {
                  'Cookie': cookie,
                  'User-Agent': 'Mozilla/5.0 (compatible; GitHub-OIC-Extractor/1.0)',
                  'Accept': 'application/json'
                }
              });
              
              const data = response.data;
              const members = data.query?.categorymembers || [];
              
              console.log(`✅ ${members.length} compétences récupérées`);
              
              if (members.length === 0) {
                hasMore = false;
                break;
              }
              
              // Traiter chaque compétence
              for (const member of members) {
                const competence = {
                  objectif_id: member.title,
                  pageid: member.pageid,
                  title: member.title,
                  timestamp: new Date().toISOString(),
                  url: `https://livret.uness.fr/lisa/2025/${encodeURIComponent(member.title)}`
                };
                
                // Extraire les détails si possible
                if (member.title.match(/^OIC-\d+/)) {
                  const itemMatch = member.title.match(/^OIC-(\d+)/);
                  if (itemMatch) {
                    competence.item_parent = itemMatch[1].padStart(3, '0');
                    competence.rang = 'A'; // Défaut
                  }
                }
                
                allCompetences.push(competence);
              }
              
              // Vérifier s'il y a plus de données
              if (data.continue && data.continue.cmcontinue) {
                offset = data.continue.cmcontinue;
              } else {
                hasMore = false;
              }
              
              // Limite de sécurité
              if (allCompetences.length > 10000) {
                console.log('⚠️  Limite de sécurité atteinte (10k compétences)');
                hasMore = false;
              }
              
            } catch (error) {
              console.error(`❌ Erreur batch ${offset}:`, error.message);
              hasMore = false;
            }
            
            // Pause entre les requêtes
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          
          console.log(`🎯 EXTRACTION TERMINÉE: ${allCompetences.length} compétences`);
          
          // Sauvegarder en JSON
          await fs.writeJSON('oic-competences-full.json', {
            metadata: {
              total_count: allCompetences.length,
              extracted_at: new Date().toISOString(),
              source: 'https://livret.uness.fr/lisa/2025/',
              extractor: 'GitHub Action'
            },
            competences: allCompetences
          }, { spaces: 2 });
          
          console.log('💾 Données sauvegardées dans oic-competences-full.json');
          
          // Statistiques
          const stats = {
            total: allCompetences.length,
            by_item: {}
          };
          
          allCompetences.forEach(comp => {
            if (comp.item_parent) {
              stats.by_item[comp.item_parent] = (stats.by_item[comp.item_parent] || 0) + 1;
            }
          });
          
          console.log('📊 STATISTIQUES:');
          console.log(`   Total: ${stats.total} compétences`);
          console.log(`   Items uniques: ${Object.keys(stats.by_item).length}`);
          
          return allCompetences;
        }
        
        extractAllOIC().catch(console.error);
        EOF
        
    - name: Extract all OIC competences
      env:
        BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      run: |
        echo "🔄 Lancement de l'extraction complète..."
        node extract-all-oic.js
        
    - name: Upload extracted data
      uses: actions/upload-artifact@v4
      with:
        name: oic-competences-complete
        path: oic-competences-full.json
        retention-days: 30
        
    - name: Display summary
      run: |
        if [ -f oic-competences-full.json ]; then
          echo "✅ Extraction réussie !"
          echo "📊 Résumé:"
          node -e "
            const data = require('./oic-competences-full.json');
            console.log(\`   📋 Total: \${data.competences.length} compétences\`);
            console.log(\`   📅 Extracté le: \${data.metadata.extracted_at}\`);
            console.log(\`   🔍 Premiers exemples:\`);
            data.competences.slice(0, 5).forEach((comp, i) => {
              console.log(\`      \${i+1}. \${comp.title}\`);
            });
          "
        else
          echo "❌ Échec de l'extraction"
          exit 1
        fi