name: 🔒 Security Audit & Quality Check

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
  schedule:
    # Run security audit every Monday at 9:00 AM
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  security-scan:
    name: 🔍 Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      # =================================================================
      # SECRET SCANNING
      # =================================================================
      - name: 🔐 TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # =================================================================
      # DEPENDENCY AUDIT
      # =================================================================
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run pnpm audit
        run: |
          echo "## 📊 Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
          pnpm audit --json > audit-results.json || true

          # Parse and display results
          if [ -s audit-results.json ]; then
            echo "Found vulnerabilities:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat audit-results.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔍 Run custom security audit script
        run: pnpm run audit
        continue-on-error: true

      # =================================================================
      # STATIC CODE ANALYSIS (SAST)
      # =================================================================
      - name: 🔍 ESLint Security Check
        run: |
          pnpm lint --max-warnings 0 || true
          echo "## 📝 Linting Results" >> $GITHUB_STEP_SUMMARY
          echo "ESLint check completed" >> $GITHUB_STEP_SUMMARY

      # =================================================================
      # SNYK VULNERABILITY SCAN (Optional - requires token)
      # =================================================================
      - name: 🔍 Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # =================================================================
      # UPLOAD RESULTS
      # =================================================================
      - name: 📤 Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: |
            audit-results.json
            security-audit-report-*.md
          retention-days: 30

  code-quality:
    name: 📊 Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # =================================================================
      # TYPE CHECKING
      # =================================================================
      - name: 🔍 TypeScript Check
        run: |
          echo "## 🔧 TypeScript Results" >> $GITHUB_STEP_SUMMARY
          pnpm tsc --noEmit || echo "⚠️ TypeScript errors found" >> $GITHUB_STEP_SUMMARY

      # =================================================================
      # CODE FORMATTING
      # =================================================================
      - name: 🎨 Prettier Check
        run: |
          echo "## 🎨 Formatting Check" >> $GITHUB_STEP_SUMMARY
          pnpm exec prettier --check . || echo "⚠️ Formatting issues found" >> $GITHUB_STEP_SUMMARY

      # =================================================================
      # BUILD TEST
      # =================================================================
      - name: 🏗️ Build Check
        run: |
          echo "## 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
          pnpm build || echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY

  tests:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      # =================================================================
      # UNIT TESTS
      # =================================================================
      - name: 🧪 Run Unit Tests
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          pnpm test --coverage || echo "⚠️ Some tests failed" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      # =================================================================
      # E2E TESTS (Optional - can be resource intensive)
      # =================================================================
      - name: 🎭 Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: 🧪 Run E2E Tests
        run: pnpm test:e2e || true
        continue-on-error: true

  lighthouse:
    name: ⚡ Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build for production
        run: pnpm build
        env:
          NODE_ENV: production

      - name: ⚡ Run Lighthouse
        run: |
          pnpm exec playwright install chromium
          # Add your Lighthouse test command here
          echo "## ⚡ Performance Results" >> $GITHUB_STEP_SUMMARY
          echo "Lighthouse audit completed" >> $GITHUB_STEP_SUMMARY

  summary:
    name: 📊 Audit Summary
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, tests]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "# 🔒 Security & Quality Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if all jobs succeeded
          if [ "${{ needs.security-scan.result }}" = "success" ] && \
             [ "${{ needs.code-quality.result }}" = "success" ] && \
             [ "${{ needs.tests.result }}" = "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some checks failed. Please review the details above.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🚨 Notify on failure
        if: failure()
        run: |
          echo "::error::Security audit or quality checks failed. Please review the logs."
