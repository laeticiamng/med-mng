name: Completer OIC depuis LiSA (URL par URL)

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Taille du lot"
        required: false
        default: "400"
      max_items:
        description: "Plafond total à traiter dans ce run"
        required: false
        default: "5000"
      concurrency:
        description: "Onglets parallèles"
        required: false
        default: "3"

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: "https://yaincoxihiqdksxgrsrk.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
      CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
      NODE_OPTIONS: "--max_old_space_size=4096"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "false"
      PUPPETEER_CACHE_DIR: "/home/runner/.puppeteer-cache"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install system dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 \
            libxtst6 libnss3 libxss1 libglib2.0-0 libgbm1 libatk1.0-0 \
            libatk-bridge2.0-0 libgtk-3-0 libdrm2 libasound2t64 fonts-liberation

      - name: Install runner dependencies
        working-directory: automation/oic-completion
        run: |
          # Utiliser npm install pour générer un lockfile complet
          npm install --no-audit --no-fund

      - name: Run completion (Puppeteer)
        working-directory: automation/oic-completion
        env:
          SUPABASE_URL: "https://yaincoxihiqdksxgrsrk.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
          CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
        run: |
          node complete-by-url-puppeteer.js \
            --batch "${{ github.event.inputs.batch_size || '400' }}" \
            --maxItems "${{ github.event.inputs.max_items || '5000' }}" \
            --concurrency "${{ github.event.inputs.concurrency || '3' }}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: |
            npm-debug.log
            /home/runner/.npm/_logs/*
          if-no-files-found: ignore