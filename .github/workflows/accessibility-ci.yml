# Audit d'accessibilité (axe-core + Lighthouse) sur le build de production.
#
# Lancement manuel uniquement (onglet Actions > « Accessibilité » > Run workflow) :
# tant que les contrastes de couleur ne sont pas corrigés, ce contrôle est rouge à juste
# titre (couleur primaire #3c83f6 : texte blanc 3,63:1, minimum WCAG AA 4,5:1) et il ne doit
# pas bloquer les pull requests. La vérification automatique (tests, types, build) est ci.yml.
#
# Aucun secret. Commandes reproductibles en local :
#   bun install --frozen-lockfile && npx vite build
#   npx playwright install chromium
#   npx playwright test -c playwright.a11y.config.ts --project=chromium
#   npx --yes @lhci/cli@0.15.1 autorun --config=.github/lighthouse/lighthouserc.json
name: Accessibilité (axe-core et Lighthouse)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-tests:
    name: Tests Accessibilité (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances (bun.lock figé)
        run: bun install --frozen-lockfile

      - name: Installer le navigateur Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build de production
        run: npx vite build

      # Le serveur de prévisualisation (dist/ sur 127.0.0.1:4173) est lancé par la config.
      - name: Tests axe-core (WCAG 2.1 AA)
        run: npx playwright test -c playwright.a11y.config.ts --project=${{ matrix.browser }}

      - name: Résumé
        if: always()
        run: |
          {
            echo "## Accessibilité axe-core : ${{ matrix.browser }}"
            if [ -f test-results/a11y-results.json ]; then
              node -e '
                const r = require("./test-results/a11y-results.json");
                const s = r.stats || {};
                console.log(`- Réussis : ${s.expected ?? 0}`);
                console.log(`- Échoués : ${s.unexpected ?? 0}`);
                console.log("");
                console.log("Détail des violations : artefact accessibility-results-${{ matrix.browser }} (playwright-report/index.html).");
              '
            else
              echo "Aucun résultat produit (voir le journal de l'étape précédente)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  lighthouse-accessibility:
    name: Audit Lighthouse Accessibilité
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances (bun.lock figé)
        run: bun install --frozen-lockfile

      - name: Build de production
        run: npx vite build

      # Lighthouse CI sert lui-même dist/ (staticDistDir) et utilise le Chrome du runner.
      # Rapports écrits sur disque (pas de publication publique) puis joints en artefact.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.github/lighthouse/lighthouserc.json

      - name: Conserver les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
          if-no-files-found: ignore

  accessibility-summary:
    name: Résumé Accessibilité
    runs-on: ubuntu-latest
    needs: [accessibility-tests, lighthouse-accessibility]
    if: always()

    steps:
      - name: Résumé et verdict
        run: |
          {
            echo "# Audit d'accessibilité"
            echo ""
            echo "- Tests axe-core (3 navigateurs) : ${{ needs.accessibility-tests.result }}"
            echo "- Audit Lighthouse : ${{ needs.lighthouse-accessibility.result }}"
            echo ""
            echo "Commit : ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.accessibility-tests.result }}" != "success" ] || [ "${{ needs.lighthouse-accessibility.result }}" != "success" ]; then
            echo "Des violations d'accessibilité ont été détectées : voir les artefacts des jobs."
            exit 1
          fi
          echo "Aucune violation détectée."
