name: EDN Complete - Tests Automatisés

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Exécution quotidienne à 6h UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  performance-tests:
    name: Tests de Performance Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Lighthouse performance tests
        id: lighthouse
        run: |
          node scripts/measure-lazy-loading-impact.js > lighthouse-output.txt
          cat lighthouse-output.txt
        continue-on-error: true

      - name: Check performance thresholds
        id: perf-check
        run: |
          # Extraire les métriques du rapport
          if [ -f "performance-reports/comparison-*.json" ]; then
            LATEST_REPORT=$(ls -t performance-reports/comparison-*.json | head -1)
            echo "Latest report: $LATEST_REPORT"
            
            # Vérifier les seuils (FCP < 1.8s, LCP < 2.5s, TBT < 300ms)
            FCP=$(jq -r '.with_lazy_loading.metrics.fcp // 0' "$LATEST_REPORT")
            LCP=$(jq -r '.with_lazy_loading.metrics.lcp // 0' "$LATEST_REPORT")
            TBT=$(jq -r '.with_lazy_loading.metrics.tbt // 0' "$LATEST_REPORT")
            
            echo "FCP: ${FCP}s (seuil: 1.8s)"
            echo "LCP: ${LCP}s (seuil: 2.5s)"
            echo "TBT: ${TBT}ms (seuil: 300ms)"
            
            FAILED=0
            if (( $(echo "$FCP > 1.8" | bc -l) )); then
              echo "::error::FCP dépasse le seuil: ${FCP}s > 1.8s"
              FAILED=1
            fi
            if (( $(echo "$LCP > 2.5" | bc -l) )); then
              echo "::error::LCP dépasse le seuil: ${LCP}s > 2.5s"
              FAILED=1
            fi
            if (( $(echo "$TBT > 300" | bc -l) )); then
              echo "::error::TBT dépasse le seuil: ${TBT}ms > 300ms"
              FAILED=1
            fi
            
            exit $FAILED
          else
            echo "::warning::Aucun rapport de performance trouvé"
            exit 0
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            performance-reports/
            lighthouse-output.txt
          retention-days: 30

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const glob = require('glob');
            
            // Trouver le dernier rapport
            const reports = glob.sync('performance-reports/comparison-*.json');
            if (reports.length === 0) {
              console.log('No performance reports found');
              return;
            }
            
            const latestReport = reports.sort().reverse()[0];
            const data = JSON.parse(fs.readFileSync(latestReport, 'utf8'));
            
            const comment = `## 📊 Rapport de Performance - EDN Complete
            
            ### Métriques Core Web Vitals
            
            | Métrique | Sans Lazy Loading | Avec Lazy Loading | Amélioration | Statut |
            |----------|-------------------|-------------------|--------------|--------|
            | **FCP** | ${data.without_lazy_loading?.metrics?.fcp || 'N/A'}s | ${data.with_lazy_loading?.metrics?.fcp || 'N/A'}s | ${data.improvements?.fcp || 'N/A'} | ${data.with_lazy_loading?.metrics?.fcp < 1.8 ? '✅' : '❌'} |
            | **LCP** | ${data.without_lazy_loading?.metrics?.lcp || 'N/A'}s | ${data.with_lazy_loading?.metrics?.lcp || 'N/A'}s | ${data.improvements?.lcp || 'N/A'} | ${data.with_lazy_loading?.metrics?.lcp < 2.5 ? '✅' : '❌'} |
            | **TBT** | ${data.without_lazy_loading?.metrics?.tbt || 'N/A'}ms | ${data.with_lazy_loading?.metrics?.tbt || 'N/A'}ms | ${data.improvements?.tbt || 'N/A'} | ${data.with_lazy_loading?.metrics?.tbt < 300 ? '✅' : '❌'} |
            | **CLS** | ${data.without_lazy_loading?.metrics?.cls || 'N/A'} | ${data.with_lazy_loading?.metrics?.cls || 'N/A'} | ${data.improvements?.cls || 'N/A'} | ${data.with_lazy_loading?.metrics?.cls < 0.1 ? '✅' : '❌'} |
            
            ### Objectifs de Performance
            - ✅ FCP < 1.8s
            - ✅ LCP < 2.5s
            - ✅ TBT < 300ms
            - ℹ️ CLS < 0.1
            
            <details>
            <summary>📈 Voir les détails complets</summary>
            
            **Score Performance:** ${data.with_lazy_loading?.score || 'N/A'}/100
            
            **Temps de chargement:**
            - Sans lazy loading: ${data.without_lazy_loading?.loadTime || 'N/A'}ms
            - Avec lazy loading: ${data.with_lazy_loading?.loadTime || 'N/A'}ms
            
            </details>
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  e2e-tests:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test tests/e2e/edn-complete.spec.ts --reporter=html,json
        continue-on-error: true

      - name: Check E2E test results
        run: |
          if [ -f "playwright-report/results.json" ]; then
            TOTAL=$(jq '.suites[0].specs | length' playwright-report/results.json)
            PASSED=$(jq '[.suites[0].specs[].tests[].results[] | select(.status=="passed")] | length' playwright-report/results.json)
            FAILED=$(jq '[.suites[0].specs[].tests[].results[] | select(.status=="failed")] | length' playwright-report/results.json)
            
            echo "Tests E2E: $PASSED/$TOTAL passés"
            
            if [ $FAILED -gt 0 ]; then
              echo "::error::$FAILED tests E2E ont échoué"
              exit 1
            fi
          fi

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Comment PR with E2E results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('playwright-report/results.json')) {
              console.log('No E2E test results found');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
            const total = results.suites[0].specs.length;
            const passed = results.suites[0].specs.filter(s => 
              s.tests[0].results[0].status === 'passed'
            ).length;
            const failed = total - passed;
            
            const comment = `## 🎭 Résultats Tests E2E - EDN Complete
            
            **Total:** ${total} tests | **Passés:** ${passed} ✅ | **Échoués:** ${failed} ❌
            
            ### Scénarios testés:
            - ✅ Navigation de base (3 tests)
            - ✅ Filtrage et recherche (3 tests)
            - ✅ Interactions modal/tabs (3 tests)
            - ✅ Responsive design (3 tests)
            - ✅ Performance lazy loading (3 tests)
            
            ${failed > 0 ? '⚠️ Certains tests ont échoué. Consultez les artifacts pour plus de détails.' : '🎉 Tous les tests sont passés!'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  accessibility-tests:
    name: Tests d'Accessibilité (axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: npm run build

      - name: Run accessibility tests
        run: npx playwright test tests/accessibility/edn-components.spec.ts --reporter=html,json
        continue-on-error: true

      - name: Check accessibility violations
        id: a11y-check
        run: |
          if [ -f "playwright-report/results.json" ]; then
            VIOLATIONS=$(jq '[.suites[0].specs[].tests[].results[] | select(.status=="failed")] | length' playwright-report/results.json)
            
            if [ $VIOLATIONS -gt 0 ]; then
              echo "::error::$VIOLATIONS violations d'accessibilité détectées"
              exit 1
            else
              echo "✅ Aucune violation d'accessibilité WCAG 2.1 AA"
            fi
          fi

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Comment PR with accessibility results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('playwright-report/results.json')) {
              console.log('No accessibility test results found');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
            const total = results.suites[0].specs.length;
            const passed = results.suites[0].specs.filter(s => 
              s.tests[0].results[0].status === 'passed'
            ).length;
            const failed = total - passed;
            
            const comment = `## ♿ Résultats Tests d'Accessibilité - EDN Complete
            
            **Conformité WCAG 2.1 AA:** ${failed === 0 ? '✅ CONFORME' : '❌ NON CONFORME'}
            
            **Tests:** ${total} | **Passés:** ${passed} ✅ | **Violations:** ${failed} ❌
            
            ### Composants testés:
            - EdnHeader (4 tests)
            - EdnFilters (4 tests)
            - EdnItemsGrid (4 tests)
            - EdnTabsContent (4 tests)
            
            ### Critères validés:
            - ${failed === 0 ? '✅' : '⚠️'} Navigation clavier
            - ${failed === 0 ? '✅' : '⚠️'} Attributs ARIA
            - ${failed === 0 ? '✅' : '⚠️'} Contraste des couleurs
            - ${failed === 0 ? '✅' : '⚠️'} Structure sémantique
            
            ${failed > 0 ? '⚠️ Des violations ont été détectées. Consultez les artifacts pour les détails.' : '🎉 Tous les tests d\'accessibilité sont passés!'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  summary:
    name: Résumé des Tests
    runs-on: ubuntu-latest
    needs: [performance-tests, e2e-tests, accessibility-tests]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 📊 Résumé Global des Tests - EDN Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Statuts des Jobs:" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility Tests: ${{ needs.accessibility-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.performance-tests.result }}" == "success" ] && \
             [ "${{ needs.e2e-tests.result }}" == "success" ] && \
             [ "${{ needs.accessibility-tests.result }}" == "success" ]; then
            echo "✅ **TOUS LES TESTS SONT PASSÉS AVEC SUCCÈS**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **CERTAINS TESTS ONT ÉCHOUÉ**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Consultez les artifacts et les rapports détaillés ci-dessus." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check overall status
        run: |
          if [ "${{ needs.performance-tests.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ] || \
             [ "${{ needs.accessibility-tests.result }}" == "failure" ]; then
            echo "::error::Un ou plusieurs tests ont échoué"
            exit 1
          fi
