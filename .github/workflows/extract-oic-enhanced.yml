name: 🚀 Extraction OIC Enhanced (basé sur script working)

on:
  workflow_dispatch:   # Lancement manuel
    inputs:
      batch_size:
        description: 'Taille des lots pour l extraction'
        required: false
        default: '50'
        type: string
      max_pages:
        description: 'Nombre maximum de pages à traiter'
        required: false
        default: '5000'
        type: string
  schedule:
    - cron: '0 2 * * 0'   # Chaque dimanche à 2h

jobs:
  diagnostic-api:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔍 Test API de catégorie
      run: |
        echo "🔍 Test API MediaWiki (1 résultat)..."
        curl -s 'https://livret.uness.fr/lisa/2025/api.php?action=query&list=categorymembers&cmtitle=Catégorie:Objectif_de_connaissance&cmlimit=1&format=json&origin=*' | jq .
        
    - name: 📦 Test batch 50
      run: |
        echo "📄 Test 50 pages avec prop=revisions..."
        IDS=$(curl -s 'https://livret.uness.fr/lisa/2025/api.php?action=query&list=categorymembers&cmtitle=Catégorie:Objectif_de_connaissance&cmlimit=50&format=json&origin=*' | jq -r '.query.categorymembers[].pageid' | paste -sd'|' -)
        echo "🔢 Page IDs récupérés: $IDS"
        if [ -n "$IDS" ]; then
          echo "📖 Test récupération contenu..."
          curl -s "https://livret.uness.fr/lisa/2025/api.php?action=query&prop=revisions&rvprop=content|timestamp&format=json&origin=*&pageids=${IDS}&formatversion=2" | jq '.query.pages | length'
        else
          echo "❌ Aucun ID récupéré - problème avec la catégorie"
        fi

  extract:
    runs-on: ubuntu-latest
    needs: diagnostic-api
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: 📦 Installer les dépendances dans oic-scripts
      working-directory: oic-scripts
      run: |
        npm install

    - name: 🚀 Exécuter l'extraction OIC avec le script existant
      working-directory: oic-scripts
      env:
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        CAS_USERNAME: ${{ secrets.CAS_USERNAME }}
        CAS_PASSWORD: ${{ secrets.CAS_PASSWORD }}
        BATCH_SIZE: ${{ github.event.inputs.batch_size || '500' }}
        FORCE_UPDATE: 'true'
      run: |
        echo "🔧 Configuration de l'extraction enhanced..."
        echo "🔢 Batch size: ${BATCH_SIZE}"
        echo "🔥 Force update: ${FORCE_UPDATE}"
        echo "📊 Utilisation du script existant extract-oic-competences.cjs"
        
        # Utiliser directement votre script qui marche
        node extract-oic-competences.cjs
    
    - name: 📋 Upload rapport d'extraction
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rapport-extraction-enhanced-${{ github.run_number }}
        path: |
          rapport-*.json
        retention-days: 7