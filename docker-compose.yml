version: '3.8'
services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medmng
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: medmng
      SUPABASE_URL: http://supabase-mock:8000
    ports:
      - "3000:3000"
    depends_on:
      - db
      - supabase-mock

  supabase-mock:
    image: supabase/cli:latest
    command: start
    ports:
      - "8000:8000"
volumes:
  db_data:
