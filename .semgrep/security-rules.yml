rules:
  - id: missing-jwt-auth
    pattern-either:
      - pattern: |
          serve(async (req) => {
            ...
          })
      - pattern: |
          export async function handler(req: Request) {
            ...
          }
    pattern-not-inside: |
      const authHeader = req.headers.get('Authorization')
      ...
    message: "Edge Function missing JWT authentication check. All functions should verify Authorization header."
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - apps/functions/*/index.ts
      exclude:
        - apps/functions/*webhook*/index.ts

  - id: missing-admin-check
    patterns:
      - pattern-inside: |
          serve(async (req) => {
            ...
          })
      - pattern-regex: "(export|admin|bulk|delete-all|regenerate-all)"
      - pattern-not: |
          const isAdmin = ...
    message: "Admin endpoint missing role verification. Use user_roles table to check for admin role."
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - apps/functions/admin-*/index.ts
        - apps/functions/*/admin*.ts

  - id: missing-rate-limit
    patterns:
      - pattern-inside: |
          serve(async (req) => {
            ...
          })
      - pattern-regex: "(openai|gpt|dall-e|suno|music|generate)"
      - pattern-not: |
          await checkRateLimit(...)
    message: "Costly API endpoint missing rate limiting. Use checkRateLimit() from rate-limit.ts"
    severity: WARNING
    languages: [typescript, javascript]
    paths:
      include:
        - apps/functions/*/index.ts

  - id: sql-injection-template-literal
    pattern: |
      supabase.from($TABLE).select(`...${$VAR}...`)
    message: "Potential SQL injection via template literal. Use parameterized queries."
    severity: ERROR
    languages: [typescript, javascript]

  - id: sql-injection-concat
    pattern-either:
      - pattern: |
          $QUERY + $VAR
      - pattern: |
          `SELECT * FROM ${$TABLE}`
    message: "SQL injection risk with string concatenation. Use parameterized queries."
    severity: ERROR
    languages: [typescript, javascript]

  - id: xss-dangerous-html
    pattern-either:
      - pattern: |
          dangerouslySetInnerHTML={{__html: $VAR}}
      - pattern: |
          $EL.innerHTML = $VAR
    pattern-not: |
      DOMPurify.sanitize($VAR)
    message: "XSS vulnerability: inserting unsanitized HTML. Use DOMPurify.sanitize()"
    severity: ERROR
    languages: [typescript, javascript, tsx, jsx]

  - id: missing-cors-validation
    patterns:
      - pattern-inside: |
          serve(async (req) => {
            ...
          })
      - pattern: |
          const origin = req.headers.get('origin')
      - pattern-not: |
          if (allowedOrigins.includes(origin)) { ... }
    message: "CORS origin not validated against whitelist. Verify origin before allowing."
    severity: WARNING
    languages: [typescript, javascript]

  - id: hardcoded-secret
    pattern-either:
      - pattern: |
          const $VAR = "sk_live_..."
      - pattern: |
          const $VAR = "sk-..."
      - pattern: |
          apiKey: "..."
      - pattern-regex: "(password|secret|key)\\s*[=:]\\s*['\"](?!\\$\\{)[^'\"]{10,}"
    message: "Hardcoded secret detected. Use environment variables."
    severity: ERROR
    languages: [typescript, javascript]

  - id: eval-usage
    pattern-either:
      - pattern: eval($EXPR)
      - pattern: new Function($ARGS)
      - pattern: setTimeout($STRING, ...)
      - pattern: setInterval($STRING, ...)
    message: "eval() or Function() constructor is dangerous. Avoid dynamic code execution."
    severity: ERROR
    languages: [typescript, javascript]

  - id: missing-error-handling
    patterns:
      - pattern-inside: |
          serve(async (req) => {
            ...
          })
      - pattern-not-inside: |
          try {
            ...
          } catch {
            ...
          }
    message: "Edge Function missing try-catch error handling. Wrap in try-catch for proper error responses."
    severity: WARNING
    languages: [typescript, javascript]

  - id: missing-security-logging
    patterns:
      - pattern-inside: |
          if (!authHeader) {
            ...
            return new Response(..., { status: 401 })
          }
      - pattern-not: |
          await logSecurityEvent(...)
    message: "Authentication failure not logged. Use logSecurityEvent() for security monitoring."
    severity: WARNING
    languages: [typescript, javascript]

  - id: weak-random
    pattern-either:
      - pattern: Math.random()
      - pattern: Math.floor(Math.random() * ...)
    message: "Math.random() is not cryptographically secure. Use crypto.randomUUID() or crypto.getRandomValues()."
    severity: WARNING
    languages: [typescript, javascript]

  - id: missing-csrf-token
    patterns:
      - pattern-inside: |
          serve(async (req) => {
            ...
          })
      - pattern: |
          if (req.method === 'POST') {
            ...
          }
      - pattern-regex: "(form|submit|action)"
      - pattern-not: |
          const csrfToken = ...
    message: "POST endpoint missing CSRF protection. Verify CSRF token for state-changing operations."
    severity: WARNING
    languages: [typescript, javascript]

  - id: insecure-webhook-signature
    patterns:
      - pattern-inside: |
          serve(async (req) => {
            ...
          })
      - pattern-regex: "webhook"
      - pattern-not-either:
          - pattern: |
              const signature = req.headers.get('$HEADER')
          - pattern: |
              verifySignature(...)
    message: "Webhook missing signature verification. Verify HMAC signature before processing."
    severity: ERROR
    languages: [typescript, javascript]

  - id: missing-input-validation
    patterns:
      - pattern-inside: |
          const { $PARAM } = await req.json()
      - pattern-not: |
          if (!$PARAM) { ... }
      - pattern-not: |
          if (typeof $PARAM !== ...) { ... }
    message: "Missing input validation. Validate all user inputs before processing."
    severity: WARNING
    languages: [typescript, javascript]

  - id: exposed-api-key
    pattern-either:
      - pattern: |
          fetch($URL, {
            headers: {
              'Authorization': 'Bearer sk-...',
              ...
            }
          })
      - pattern: |
          openai.apiKey = 'sk-...'
    message: "API key exposed in code. Use environment variables (Deno.env.get())."
    severity: ERROR
    languages: [typescript, javascript]

  - id: unencrypted-sensitive-data
    patterns:
      - pattern-regex: "(password|ssn|credit_card|token)"
      - pattern: |
          supabase.from($TABLE).insert({
            ...,
            $FIELD: $VALUE
          })
      - pattern-not: |
          encrypt($VALUE)
    message: "Sensitive data stored without encryption. Consider encrypting before storage."
    severity: WARNING
    languages: [typescript, javascript]
