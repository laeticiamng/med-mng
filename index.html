    <!-- Async CSS loading to eliminate main CSS render blocking -->
    <script>
      (function() {
        // Load main CSS asynchronously to eliminate render blocking
        var cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = '/src/index.css';
        cssLink.media = 'print'; // Load as non-blocking initially
        cssLink.onload = function() { 
          this.media = 'all'; // Apply once loaded
        };
        cssLink.onerror = function() { 
          this.media = 'all'; // Apply even on error to ensure fallback
        };
        document.head.appendChild(cssLink);
        
        // Fallback timer to ensure CSS applies
        setTimeout(function() {
          if (cssLink.media !== 'all') {
            cssLink.media = 'all';
          }
        }, 300);
      })();
    </script>
