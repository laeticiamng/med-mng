
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MED MNG par EmotionsCare - Expérience Immersive d'Apprentissage Médical</title>
    <meta name="description" content="Plateforme immersive d'apprentissage des items EDN et situations ECOS - Médecine sensorielle et interactive" />
    <meta name="author" content="MED MNG par EmotionsCare" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#4B5563" />

    <!-- Google Fonts - Optimized for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload critical font CSS to start loading immediately -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <!-- Fallback for browsers that don't support preload -->
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
    
    <!-- Preload critical scripts for faster execution -->
    <link rel="modulepreload" href="/src/main.tsx">
    <link rel="modulepreload" href="/src/App.tsx">
    <link rel="modulepreload" href="/src/pages/Index.tsx">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//yaincoxihiqdksxgrsrk.supabase.co">
    <link rel="preconnect" href="//yaincoxihiqdksxgrsrk.supabase.co" crossorigin>
    
    <!-- Inline script to handle font loading optimization -->
    <script>
      // Ensure font stylesheet loads even if preload fails
      if (!window.FontFace) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap';
        document.head.appendChild(link);
      }
      
      // Register Service Worker for efficient caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>

    <meta property="og:title" content="MED MNG par EmotionsCare - Apprentissage Médical Immersif" />
    <meta property="og:description" content="Et si la médecine devenait une expérience sensorielle ? Découvrez les items EDN et situations ECOS dans un univers immersif unique." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@medmng" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Critical CSS for immediate rendering -->
    <style>
      /* Critical CSS - Font fallbacks to prevent layout shift */
      :root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
      }
      
      /* Critical layout styles for Speed Index */
      .critical-layout {
        min-height: 100vh;
        background: linear-gradient(135deg, #581c87 0%, #1e3a8a 50%, #312e81 100%);
        position: relative;
        overflow: hidden;
      }
      
      .critical-container {
        position: relative;
        z-index: 10;
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem;
      }
      
      .critical-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.5rem 0;
      }
      
      .critical-hero {
        text-align: center;
        padding: 3rem 0;
      }
      
      .critical-title {
        font-size: 3.75rem;
        font-weight: 700;
        color: white;
        margin-bottom: 2rem;
        line-height: 1.1;
      }
      
      /* Skeleton loading styles */
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 75%);
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
      }
      
      @keyframes skeleton-loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      
      .card-skeleton {
        background: rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 0.75rem;
        padding: 2rem;
        margin-bottom: 1rem;
      }
      
      /* Performance optimizations */
      .will-change-transform {
        will-change: transform;
      }
      
      .gpu-accelerated {
        transform: translateZ(0);
        backface-visibility: hidden;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
