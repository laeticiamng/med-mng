    <!-- Critical CSS Inline (Above-the-fold) -->
    <style>
      /* Critical CSS - Base Reset & Layout */
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      body { line-height: 1.5; -webkit-font-smoothing: antialiased; }
      img, picture, video, canvas, svg { display: block; max-width: 100%; }
      input, button, textarea, select { font: inherit; }
      p, h1, h2, h3, h4, h5, h6 { overflow-wrap: break-word; }
      
      /* Critical Theme Variables */
      :root {
        --background: 0 0% 98%;
        --foreground: 213 32% 19%;
        --primary: 213 94% 68%;
        --primary-foreground: 0 0% 100%;
        --card: 0 0% 100%;
        --radius: 0.75rem;
      }
      
      .dark {
        --background: 213 32% 12%;
        --foreground: 0 0% 98%;
        --primary: 213 94% 75%;
        --card: 215 28% 16%;
      }
      
      /* Critical Layout */
      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      
      /* Loading State */
      #root { min-height: 100vh; }
      
      /* Navigation mobile premium optimisée */
      @media (max-width: 768px) {
        body {
          -webkit-text-size-adjust: 100%;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
          overscroll-behavior: contain;
        }
        
        button, [role="button"], [role="tab"] {
          min-height: 48px;
          min-width: 48px;
          -webkit-user-select: none;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
          transition: transform 0.15s ease;
        }
        
        button:active, [role="button"]:active, [role="tab"]:active {
          transform: scale(0.95);
        }
        
        .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
          scroll-behavior: smooth;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
          display: none;
        }
        
        input[type="text"], input[type="search"], textarea {
          font-size: 16px;
          -webkit-appearance: none;
          border-radius: 12px;
        }
        
        /* Amélioration des modales sur mobile */
        [data-radix-portal] {
          position: fixed !important;
          inset: 0 !important;
          z-index: 9999 !important;
        }
        
        /* Navigation par gestes */
        .swipe-indicator {
          background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.3), transparent);
          height: 2px;
          width: 100%;
          position: absolute;
          bottom: 0;
          animation: swipe-hint 2s infinite;
        }
        
        @keyframes swipe-hint {
          0%, 100% { opacity: 0; }
          50% { opacity: 1; }
        }
      }
      
      @supports (-webkit-touch-callout: none) {
        .modal-content {
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
        }
        
        /* Amélioration pour Safari iOS */
        .safe-area-inset {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      
      /* Animations fluides pour les interactions */
      .premium-transition {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .premium-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
    </style>
