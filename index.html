
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MED MNG par EmotionsCare - Expérience Immersive d'Apprentissage Médical</title>
    <meta name="description" content="Plateforme immersive d'apprentissage des items EDN et situations ECOS - Médecine sensorielle et interactive" />
    <meta name="author" content="MED MNG par EmotionsCare" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#4B5563" />

    <!-- Google Fonts - Optimized for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload critical font CSS to start loading immediately -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <!-- Fallback for browsers that don't support preload -->
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
    
    <!-- Inline script to handle font loading optimization -->
    <script>
      // Ensure font stylesheet loads even if preload fails
      if (!window.FontFace) {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap';
        document.head.appendChild(link);
      }
      
      // Register Service Worker for efficient caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>

    <meta property="og:title" content="MED MNG par EmotionsCare - Apprentissage Médical Immersif" />
    <meta property="og:description" content="Et si la médecine devenait une expérience sensorielle ? Découvrez les items EDN et situations ECOS dans un univers immersif unique." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@medmng" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <style>
      /* Critical CSS - Font fallbacks to prevent layout shift */
      :root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
      }
      
      /* Navigation mobile premium optimisée */
      @media (max-width: 768px) {
        body {
          -webkit-text-size-adjust: 100%;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
          overscroll-behavior: contain;
        }
        
        button, [role="button"], [role="tab"] {
          min-height: 48px;
          min-width: 48px;
          -webkit-user-select: none;
          user-select: none;
          -webkit-tap-highlight-color: transparent;
          touch-action: manipulation;
          transition: transform 0.15s ease;
        }
        
        button:active, [role="button"]:active, [role="tab"]:active {
          transform: scale(0.95);
        }
        
        .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
          scroll-behavior: smooth;
        }
        
        .scrollbar-hide::-webkit-scrollbar {
          display: none;
        }
        
        input[type="text"], input[type="search"], textarea {
          font-size: 16px;
          -webkit-appearance: none;
          border-radius: 12px;
        }
        
        /* Amélioration des modales sur mobile */
        [data-radix-portal] {
          position: fixed !important;
          inset: 0 !important;
          z-index: 9999 !important;
        }
        
        /* Navigation par gestes */
        .swipe-indicator {
          background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.3), transparent);
          height: 2px;
          width: 100%;
          position: absolute;
          bottom: 0;
          animation: swipe-hint 2s infinite;
        }
        
        @keyframes swipe-hint {
          0%, 100% { opacity: 0; }
          50% { opacity: 1; }
        }
      }
      
      @supports (-webkit-touch-callout: none) {
        .modal-content {
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
        }
        
        /* Amélioration pour Safari iOS */
        .safe-area-inset {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      
      /* Animations fluides pour les interactions */
      .premium-transition {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .premium-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
